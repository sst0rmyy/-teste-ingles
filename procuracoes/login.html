<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Livro de Procurações</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<meta name="theme-color" content="#fffdf8">
<style>
:root{--fundo:#f2eee4;--painel:#fffdf8;--linha:#e4dac6;--linha-forte:#cfc0a2;--texto:#2a251d;--texto-2:#625a4b;--ouro:#c4a052;--acento:#8c6a1d;--at:#a8261d;--at-suave:#f9e5e2;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fundo);color:var(--texto);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:380px;background:var(--painel);border:1px solid var(--linha);border-top:3px solid var(--ouro);border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(58,47,28,.06)}
.marca{display:flex;align-items:center;gap:12px}
.selo{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ouro);box-shadow:inset 0 0 0 3px var(--painel),inset 0 0 0 4px var(--ouro);display:grid;place-items:center;font:600 14px Georgia,serif;color:#7a5c1e;flex:none}
h1{font:600 19px/1.2 Georgia,"Times New Roman",serif;margin:0}
small{color:var(--texto-2);font-size:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--texto-2)}
input{font:inherit;padding:9px 11px;border:1px solid var(--linha-forte);border-radius:6px;background:#fff;color:var(--texto)}
input:focus{outline:none;border-color:var(--acento);box-shadow:0 0 0 3px #f5ecd4}
button{font:inherit;font-weight:600;padding:10px;border-radius:6px;border:1px solid #7a5c17;background:linear-gradient(#9a7626,#8c6a1d);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.erro{background:var(--at-suave);color:var(--at);border-radius:4px;padding:8px 10px;font-size:13.5px}
</style>
</head>
<body>
<form id="f">
  <div class="marca"><span class="selo" aria-hidden="true">TN</span><div><h1>Livro de Procurações</h1><small>Tabeliã de Notas e de Protesto · Espírito Santo do Pinhal-SP</small></div></div>
  <label>Senha do cartório<input id="senha" type="password" autocomplete="current-password" required autofocus></label>
  <div class="erro" id="erro" hidden></div>
  <button id="bt" type="submit">Entrar</button>
  <small>Este computador continuará conectado por 30 dias.</small>
</form>
<script>
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const bt = document.getElementById("bt"), erro = document.getElementById("erro");
  bt.disabled = true; erro.hidden = true;
  try {
    const r = await fetch("/api/entrar", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({senha:document.getElementById("senha").value})});
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    erro.textContent = d.erro || "Não foi possível entrar.";
  } catch (x) { erro.textContent = "O servidor do cartório não respondeu. Confira se ele está ligado."; }
  erro.hidden = false; bt.disabled = false;
});
</script>
</body>
</html>
