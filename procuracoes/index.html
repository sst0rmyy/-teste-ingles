<title>Livro de Procurações</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra institucional no topo; biblioteca (fichário) à esquerda; mesa de trabalho com etapas numeradas e folha A4 de pré-visualização. */
:root{
  /* cartório: marfim, branco e dourado envelhecido; texto em sépia escuro */
  --fundo:#f2eee4; --painel:#fffdf8; --painel-2:#f8f4ea; --linha:#e4dac6; --linha-forte:#cfc0a2;
  --texto:#2a251d; --texto-2:#625a4b; --texto-3:#8b8271;
  --marinho:#3a2f1c; --marinho-2:#7a5c1e; --sobre-marinho:#ffffff; --sobre-marinho-2:#7d7262;
  --acento:#8c6a1d; --acento-suave:#f5ecd4; --ouro:#c4a052;
  --ok:#2f6b3a; --ok-suave:#e6f0e3; --pend:#a14a12; --pend-suave:#fbe9db; --at:#a8261d; --at-suave:#f9e5e2;
  --mesa-folha:#e6dfd0; --sombra:0 1px 2px rgba(58,47,28,.06);
  --f-titulo:"IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-corpo:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dado:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-minuta: Tahoma, Verdana, "DejaVu Sans", sans-serif;
  --raio:6px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--fundo);color:var(--texto);font:14px/1.5 var(--f-corpo);margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--painel)}
table{font-size:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}

/* barra institucional */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--painel);color:var(--texto);border-bottom:2px solid var(--ouro);box-shadow:0 1px 0 var(--linha);
  padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:12px;min-width:0}
.selo{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ouro);box-shadow:inset 0 0 0 3px var(--painel),inset 0 0 0 4px var(--ouro);color:var(--marinho-2);background:var(--painel);display:grid;place-items:center;font:600 13px/1 var(--f-titulo);letter-spacing:.04em;flex:none}
.marca-txt{display:flex;flex-direction:column;min-width:0}
.marca-txt b{font:600 17px/1.2 var(--f-titulo);letter-spacing:.01em;color:var(--marinho)}
.marca-txt small{font-size:11.5px;color:var(--sobre-marinho-2);letter-spacing:.03em}
.sinc{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sobre-marinho-2)}
.barra-dir{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sinc::before{content:"";width:7px;height:7px;border-radius:50%;background:#22a05a;flex:none}
.sinc[data-t="aviso"]::before{background:#e0a127} .sinc[data-t="erro"]::before{background:#d92d20}

/* estrutura */
.app{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 56px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)} .arquivo{border-right:0;border-bottom:1px solid var(--linha)}}
.arquivo{background:var(--painel);border-right:1px solid var(--linha);padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.arquivo-topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.arquivo-topo h2{font:600 12px/1.3 var(--f-corpo);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);margin:0}
.contagem{font:500 12px var(--f-dado);color:var(--texto-3)}
.busca-wrap{position:relative}
.busca-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--texto-3)}
.busca{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--linha-forte);border-radius:var(--raio);background:var(--painel)}
.filtros{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--painel);border-radius:4px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--texto-2)}
.chip:hover{border-color:var(--linha-forte);color:var(--texto)}
.chip.on{background:var(--acento-suave);border-color:var(--acento);color:var(--acento);font-weight:600}
.lista{display:flex;flex-direction:column;min-width:0;border-top:1px solid var(--linha)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;width:100%;border:0;border-bottom:1px solid var(--linha);background:none;padding:10px 8px 10px 12px;cursor:pointer;position:relative}
.item:hover{background:var(--painel-2)}
.item.on{background:var(--acento-suave)}
.item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--ouro)}
.item b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .data{font:400 11.5px var(--f-dado);color:var(--texto-3);text-align:right}
.item .meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--texto-2)}
.vazio{border:1px dashed var(--linha-forte);border-radius:var(--raio);padding:14px;color:var(--texto-2);font-size:13px;background:var(--painel-2)}
.estado{font-size:11.5px;color:var(--texto-3);margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.pill.ok{background:var(--ok-suave);color:var(--ok)}
.pill.pend{background:var(--pend-suave);color:var(--pend)}
.pill.at{background:var(--at-suave);color:var(--at)}
.pill.inf{background:var(--acento-suave);color:var(--acento)}

/* mesa */
.mesa{padding:22px max(16px, env(safe-area-inset-right,0px)) 48px 28px;min-width:0;display:flex;flex-direction:column;gap:18px;max-width:1180px;width:100%}
@media (max-width:900px){.mesa{padding-left:max(16px, env(safe-area-inset-left,0px))}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--linha-forte);background:var(--painel);border-radius:var(--raio);padding:7px 14px;cursor:pointer;font-weight:500;font-size:13.5px;box-shadow:var(--sombra)}
.btn:hover{border-color:var(--texto-3)}
.btn.p{background:var(--acento);border-color:#7a5c17;color:#fff;background-image:linear-gradient(#9a7626,#8c6a1d)}
.btn.p:hover{filter:brightness(1.06)}
.btn.perigo{color:var(--at)}
.btn.perigo.armado{background:var(--at);color:#fff;border-color:var(--at)}
.btn:disabled{opacity:.5;cursor:not-allowed}
h2{font:600 22px/1.25 var(--f-titulo);margin:0;text-wrap:balance}
h3{font:600 12px/1.3 var(--f-corpo);letter-spacing:.08em;text-transform:uppercase;color:var(--texto-2);margin:0}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--texto-2);margin-bottom:4px}
.topo{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;padding-bottom:16px;border-bottom:1px solid var(--linha)}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
.intro{color:var(--texto-2);max-width:68ch;margin:0}

/* modelos */
.grupo-modelos{display:flex;flex-direction:column;gap:10px}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.modelo{border:1px solid var(--linha);background:var(--painel);border-radius:var(--raio);padding:14px 14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sombra)}
.modelo:hover{border-color:var(--acento)}
.modelo b{font:600 15px/1.3 var(--f-titulo)}
.modelo span{font-size:12.5px;color:var(--texto-2)}
.modelo .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

/* escolha do modelo + documentos */
.escolha{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.escolha-modelos{display:flex;flex-direction:column;gap:18px;min-width:0}
.escolha .modelos{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.modelo.on{border-color:var(--ouro);box-shadow:0 0 0 2px var(--acento-suave),inset 3px 0 0 var(--ouro);background:#fffaf0}
.docs-painel{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));background:var(--painel);border:1px solid var(--linha);border-top:3px solid var(--ouro);border-radius:var(--raio);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra);min-width:0}
.docs-cab{display:flex;flex-direction:column;gap:1px}
.docs-cab b{font:600 18px/1.25 var(--f-titulo)}
.docs-cab span:last-child{font-size:12.5px;color:var(--texto-2)}
.docs-acoes{display:flex;flex-direction:column;gap:8px}
.docs{display:flex;flex-direction:column;gap:12px}
.docs-grupo h4{margin:0 0 4px;font:600 11.5px/1.3 var(--f-corpo);letter-spacing:.05em;text-transform:uppercase;color:var(--marinho-2)}
.docs-grupo ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.doc{display:flex;gap:9px;align-items:flex-start;padding:6px 2px;border-bottom:1px dashed var(--linha);font-size:13.5px}
.docs-grupo li:last-child .doc{border-bottom:0}
span.doc::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--ouro);flex:none}
label.doc{cursor:pointer}
label.doc input{margin:3px 0 0;width:16px;height:16px;accent-color:var(--acento);flex:none}
label.doc.feito .doc-txt{color:var(--texto-3);text-decoration:line-through;text-decoration-color:var(--linha-forte)}
.doc-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.doc-txt small{font-size:11.5px;color:var(--texto-3)}
.bloco .docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px 22px}
@media (max-width:980px){.escolha{grid-template-columns:minmax(0,1fr)} .docs-painel{position:static}}

/* etapas: coluna estreita à esquerda do formulário */
.trabalho{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;align-items:start}
.etapas{position:sticky;top:calc(72px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);padding:6px}
.etapas button{border:0;background:none;padding:6px 8px;border-radius:4px;cursor:pointer;color:var(--texto-2);display:flex;align-items:center;gap:8px;text-align:left;font-weight:500;font-size:12.5px;line-height:1.25}
.etapas button:hover{background:var(--painel-2);color:var(--texto)}
.etapas button.on{color:var(--marinho);background:var(--acento-suave);font-weight:600;box-shadow:inset 3px 0 0 var(--ouro)}
.etapas .n{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--f-dado);border:1.5px solid var(--linha-forte);color:var(--texto-3);flex:none}
.etapas button.on .n{border-color:var(--acento);color:var(--acento)}
.etapas button.feita .n{background:var(--ok);border-color:var(--ok);color:#fff}
.etapas .q{margin-left:auto;font:600 10px var(--f-dado);color:var(--pend);background:var(--pend-suave);border-radius:3px;padding:0 4px}
@media (max-width:700px){.trabalho{grid-template-columns:minmax(0,1fr)} .etapas{position:static;flex-direction:row;overflow-x:auto} .etapas button{white-space:nowrap}}

/* formulários */
.painel{display:flex;flex-direction:column;gap:16px}
.bloco{background:var(--painel);border:1px solid var(--linha);border-radius:var(--raio);padding:0;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sombra)}
.bloco > *{margin:0 18px}
.bloco > :first-child{margin-top:16px}
.bloco > :last-child{margin-bottom:18px}
.bloco > * + *{margin-top:12px}
.bloco > h3:first-child,.bloco > .bloco-topo:first-child{padding-bottom:12px;border-bottom:1px solid var(--linha);margin-left:0;margin-right:0;padding-left:18px;padding-right:18px}
.bloco-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.grade .larga{grid-column:1/-1}
.grade-end{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) 100px;grid-template-areas:"cep logr logr num" "compl bairro cidade uf";gap:12px 14px}
.grade-end .c-cep{grid-area:cep} .grade-end .c-logr{grid-area:logr} .grade-end .c-num{grid-area:num} .grade-end .c-compl{grid-area:compl}
.grade-end .c-bairro{grid-area:bairro} .grade-end .c-cidade{grid-area:cidade} .grade-end .c-uf{grid-area:uf}
@media (max-width:760px){.grade-end{grid-template-columns:minmax(0,1fr) 110px;grid-template-areas:"cep cep" "logr logr" "num compl" "bairro bairro" "cidade uf"}}
.sub-tit{margin:4px 0 0;font:600 11.5px/1.3 var(--f-corpo);letter-spacing:.05em;text-transform:uppercase;color:var(--marinho-2)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--texto-2);min-width:0}
label.f.req .rot::after{content:" *";color:var(--at)}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:14px;color:var(--texto);padding:7px 10px;border:1px solid var(--linha-forte);border-radius:var(--raio);background:var(--painel);width:100%;min-height:36px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--acento);outline:none;box-shadow:0 0 0 3px var(--acento-suave)}
label.f textarea{min-height:76px;resize:vertical}
label.f.dado input{font-family:var(--f-dado);font-size:13.5px}
label.f.falta input,label.f.falta select,label.f.falta textarea{background:#fff7f0;border-color:#efcfb4}
label.f.falta input:focus,label.f.falta select:focus{background:var(--painel)}
label.f.erro input{border-color:var(--at);background:var(--at-suave)}
label.f .dica{font-weight:400;font-size:11.5px;color:var(--texto-3)}
label.f.erro .dica{color:var(--at)}
.seg{display:inline-flex;border:1px solid var(--linha-forte);border-radius:var(--raio);overflow:hidden;background:var(--painel);flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--linha);background:none;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--texto-2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acento-suave);color:var(--acento);font-weight:600}
.sub{border:1px solid var(--linha);background:var(--painel-2);border-radius:var(--raio);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.poder{border:1px solid var(--linha);border-radius:var(--raio);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--painel-2)}
.poder-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.poder-topo .num{font:600 13px var(--f-dado);color:var(--marinho-2);min-width:22px}
.poder-topo input{flex:1;min-width:140px;padding:6px 9px;border:1px solid var(--linha-forte);border-radius:var(--raio);background:var(--painel);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.mini{border:1px solid var(--linha-forte);background:var(--painel);border-radius:4px;padding:4px 9px;cursor:pointer;font-size:12.5px;color:var(--texto-2)}
.mini:hover{color:var(--texto);border-color:var(--texto-3)}
.biblio{display:flex;gap:6px;flex-wrap:wrap}
.aviso{font-size:12.5px;color:var(--texto-2)}

/* conferência */
.resumo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.resumo div{border:1px solid var(--linha);border-radius:var(--raio);padding:10px 12px;background:var(--painel-2)}
.resumo b{display:block;font:600 22px/1.1 var(--f-dado)}
.resumo span{font-size:12px;color:var(--texto-2)}
.resumo .ok b{color:var(--ok)} .resumo .pend b{color:var(--pend)} .resumo .at b{color:var(--at)}
.tabela{overflow-x:auto;border:1px solid var(--linha);border-radius:var(--raio)}
.tabela table{border-collapse:collapse;width:100%;min-width:560px}
.tabela th,.tabela td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--linha);vertical-align:top;font-size:13px}
.tabela tr:last-child td{border-bottom:0}
.tabela th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);background:var(--painel-2);position:sticky;top:0}
.tabela td.v{font-family:var(--f-dado);font-size:12.5px;overflow-wrap:anywhere}
.tabela tr.sec td{background:var(--painel-2);font-weight:600;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--marinho-2)}
.alertas{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alertas li{border:1px solid var(--at-suave);border-left:3px solid var(--at);background:var(--at-suave);padding:8px 12px;border-radius:4px;font-size:13.5px}
.alertas li.pend{border-color:var(--pend-suave);border-left-color:var(--pend);background:var(--pend-suave)}
.confirmar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:var(--raio);background:var(--acento-suave);border:1px solid var(--acento)}

/* folha A4 */
.mesa-folha{background:var(--mesa-folha);border-radius:var(--raio);padding:24px 16px;display:flex;justify-content:center;overflow-x:auto}
.folha{background:#fff;color:#111;width:100%;max-width:794px;aspect-ratio:auto;padding:76px 28px 24px 38px;font:12.5px/1.45 var(--f-minuta);box-shadow:0 2px 10px rgba(0,0,0,.18);overflow-wrap:anywhere}
.folha .tit{text-align:center;font-weight:700;text-decoration:underline;margin-bottom:16px}
.folha .corpo{text-align:justify}
.folha .ass{text-align:center;margin-top:24px}
.folha mark{background:#fff2a8;color:#111}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--marinho-2);color:var(--sobre-marinho);padding:9px 16px;border-radius:var(--raio);font-size:13.5px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.item,.modelo,.btn,.chip{transition:background-color .15s,border-color .15s}}
@media (max-width:560px){.resumo{grid-template-columns:minmax(0,1fr)} .barra{position:static} .marca-txt small{display:none} .mesa-folha{padding:12px 8px} .folha{padding:32px 14px 18px 18px}}
</style>

<header class="barra">
  <div class="marca"><span class="selo" aria-hidden="true">TN</span><span class="marca-txt"><b>Livro de Procurações</b><small>Tabeliã de Notas e de Protesto · Espírito Santo do Pinhal-SP</small></span></div>
  <div class="barra-dir"><div class="sinc" id="estado">Conectando à biblioteca…</div><button type="button" class="mini" id="bt-sair" hidden>Sair</button></div>
</header>
<div class="app">
  <aside class="arquivo" aria-label="Biblioteca">
    <button class="btn p" id="bt-nova" type="button">+ Nova procuração</button>
    <div class="arquivo-topo"><h2>Biblioteca</h2><span class="contagem" id="contagem"></span></div>
    <div class="busca-wrap"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
    <input class="busca" id="busca" type="search" placeholder="Nome, CPF ou CNPJ" aria-label="Buscar"></div>
    <div class="filtros" id="filtros"></div>
    <div class="lista" id="lista"></div>
  </aside>
  <main class="mesa" id="mesa"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>/* sem internet: usa a cópia local do servidor do cartório */ if(!window.JSZip && /^https?:$/.test(location.protocol)) document.write('<script src="/vendor/jszip.min.js"><\/script>');</script>
<script id="nucleo">

var N = (function(){

function ate999(n){
  if(n<20) return UN[n];
  if(n<100) return DZ[Math.floor(n/10)] + (n%10 ? " e " + UN[n%10] : "");
  if(n===100) return "cem";
  return CT[Math.floor(n/100)] + (n%100 ? " e " + ate999(n%100) : "");
}
function extenso(n){
  if(n<1000) return ate999(n);
  const m = Math.floor(n/1000), r = n%1000;
  const mil = (m===1 ? "" : ate999(m) + " ") + "mil";
  if(!r) return mil;
  return mil + ((r<100 || r%100===0) ? " e " : " ") + ate999(r);
}

    }
    const cpfv = vazio(p.cpf) ? null : cpfOk(p.cpf);
    R(quem+" — CPF", vazio(p.cpf)?"":fmtCPF(p.cpf), st(p.cpf, cpfv), cpfv===false?"dígito verificador inválido":"");
    if(cpfv===false) at(quem+": CPF "+fmtCPF(p.cpf)+" com dígito verificador inválido. Confira no documento original.");
    const ecn = {solteiro:"solteiro(a)",casado:"casado(a)",divorciado:"divorciado(a)",viuvo:"viúvo(a)",separado:"separado(a) judicialmente"}[p.ec]||"";
    R(quem+" — estado civil", ecn, st(p.ec));

        R(quem+" — cônjuge", p.conjNome, st(p.conjNome));

        R(quem+" — matrícula da certidão", p.certMat, st(p.certMat));
        const exigePacto = p.regime && p.regime!=="comunhão parcial de bens" && p.regime!=="separação obrigatória de bens";
        const pos77 = p.casData && p.casData >= "1977-12-26";
        if(exigePacto && pos77 && vazio(p.pacto)){ R(quem+" — pacto antenupcial", "", "ATENÇÃO", "regime exige pacto"); at(quem+": casamento após a Lei 6.515/77 sob "+p.regime+" exige pacto antenupcial. Informe a escritura e o registro do pacto."); }

        R(quem+" — certidão (matrícula)", p.certMat, st(p.certMat));
        R(quem+" — união estável", {sim:"convive com "+(p.ueNome||"?"),nao:"declara não conviver"}[p.ue]||"", st(p.ue));

    R(quem+" — CEP", vazio(p.cep)?"":fmtCEP(p.cep), st(p.cep, vazio(p.cep)||so(p.cep).length===8), "");

      if(p.assin==="nao_alfabetizado") at(quem+" não é alfabetizado(a): é obrigatório o assinante a rogo e duas testemunhas instrumentárias, com colheita da impressão digital.");

  function pj(o, quem){

    if(v===false) at(quem+": CNPJ "+fmtCNPJ(o.cnpj)+" com dígito verificador inválido. Confira no cartão CNPJ.");
    R(quem+" — NIRE", o.nire, vazio(o.nire)?"PENDENTE":"OK");
    const es = enderecoTexto(o.endr, o.sede), eo=o.endr||{}, compl_ = !vazio(eo.logr)&&!vazio(eo.num)&&!vazio(eo.bairro)&&!vazio(eo.cidade)&&!vazio(eo.uf);
    R(quem+" — sede", es, es ? (compl_ || (vazio(eo.logr) && !vazio(o.sede)) ? "OK" : "PENDENTE") : "PENDENTE");
    R(quem+" — CEP da sede", vazio(o.cep)?"":fmtCEP(o.cep), st(o.cep, vazio(o.cep)||so(o.cep).length===8));
    R(quem+" — ato constitutivo (JUCESP)", o.atoConst, st(o.atoConst));
    R(quem+" — última alteração consolidada", o.ultAlt, st(o.ultAlt));
    R(quem+" — certidão simplificada", dataBR(o.certSimpl), st(o.certSimpl));
    if(o.certSimpl && ref){ const d1=new Date(o.certSimpl), d2=new Date(ref); const dias=(d2-d1)/864e5;
      if(dias>30) at(quem+": a certidão simplificada da JUCESP tem mais de 30 dias ("+Math.round(dias)+"). Peça certidão atualizada."); }
    R(quem+" — cláusula de poderes", o.clausula, vazio(o.clausula)?"ATENÇÃO":"OK", vazio(o.clausula)?"confira no contrato social":"");
    if(vazio(o.clausula)) at(quem+": indique a cláusula do contrato social que dá ao representante poderes para outorgar procuração.");
    R(quem+" — administração", o.adm==="conjunta"?"conjunta":"isolada", "OK");
    if(o.adm==="conjunta" && o.reps.length<2) at(quem+": a administração é conjunta, mas só há um representante. Todos os administradores exigidos pelo contrato social devem comparecer e assinar.");
    o.reps.forEach((r,i)=>{ const qr="Representante"+(o.reps.length>1?" "+(i+1):"")+" ("+quem+")"; R(qr+" — cargo", r.cargo, st(r.cargo)); pf(r, qr, true, true); });
  }
  a.outorgantes.forEach((o,i)=>{ const q="Outorgante"+(a.outorgantes.length>1?" "+(i+1):""); S(q+(o.tp==="PJ"?" (pessoa jurídica)":" (pessoa física)")); o.tp==="PJ" ? pj(o.pj,q) : pf(o.pf,q,true,true); });
  a.outorgados.forEach((o,i)=>{ const q="Outorgado"+(a.outorgados.length>1?" "+(i+1):""); S(q+(o.tp==="PJ"?" (pessoa jurídica)":" (pessoa física)")); o.tp==="PJ" ? pj(o.pj,q) : pf(o.pf,q,false,false); });
  if(a.outorgados.length>1){ R("Atuação dos procuradores", {conjunto:"em conjunto",isoladamente:"em conjunto ou isoladamente"}[a.atuacao]||"", st(a.atuacao)); }

  S("Poderes");
  if(!a.poderes.length) R("Poderes", "", "PENDENTE");
  a.poderes.forEach((pd,i)=>{
    const def=PODERES[pd.k]; if(!def) return;
    const faltam = def.vars.filter(x=>x.req && vazio((pd.v||{})[x.n])).map(x=>x.l);

  return {rows, alertas};
}

  "docProps/core.xml":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>Procuração Pública</dc:title><dc:language>pt-BR</dc:language></cp:coreProperties>'
};
function textoPlano(m){ return m.titulo+"\n\n"+m.seg.map(s=>s.t).join("")+"\n\n"+m.ass.map(x=>"______________________________________________\n"+x.nome+(x.sub?"\n"+x.sub:"")).join("\n\n"); }

return {UFS, normalizar, enderecoTexto, MODELOS, PODERES, REGIMES, CARGOS_ESC, EMOL, documentos, documentosTexto, novoAto, novaParte, novaPF, montar, conferir, documentXml, DOCX_FIXOS, textoPlano,
  cpfOk, cnpjOk, fmtCPF, fmtCNPJ, fmtCEP, dataBR, dataExtensoSeg, extenso, vazio};
})();
if(typeof module!=="undefined") module.exports=N;
</script>

<script>
/* ===== Interface ===== */
(function(){
const $ = s => document.querySelector(s);
const H = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const LS_KEY = "livro-procuracoes";
let db = null, downloads = null, modoLocal = false;
let arquivo = {};          // id -> registro
let atual = null;          // id aberto
let etapa = "ato";
let filtro = "todas", termo = "";
let escreventes = [];
let fichaAberta = false;
let escolhido = "amplos_pf";  // modelo em destaque na tela de nova procuração

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function lsLer(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function lsGravar(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(arquivo)); }catch(e){} }

/* ---- persistência ---- */
// Três modos: biblioteca do Claude (db), servidor do cartório (api/) ou só este navegador.
let servidor = false;
const API = async (metodo, url, corpo) => {
  const r = await fetch(url, {method:metodo, credentials:"same-origin", headers:{"Content-Type":"application/json","X-Livro":"1"}, body: corpo===undefined ? undefined : JSON.stringify(corpo)});
  if(r.status===401){ location.href="/login"; throw new Error("sessão expirada"); }
  if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.erro || "erro "+r.status); }
  return r.json();
};
const hora = () => new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
let fila = Promise.resolve(), timer = null, sujo = new Set();
function salvarDepois(id){ if(arquivo[id]) arquivo[id].atualizadoEm=new Date().toISOString(); sujo.add(id); clearTimeout(timer); timer=setTimeout(descarregar, 700); estado("Salvando…"); }
function descarregar(){
  const ids=[...sujo]; sujo.clear();
  const falhou = e => estado("Não foi possível salvar: "+(e&&e.message||"erro")+". Suas alterações continuam na tela.");
  ids.forEach(id=>{ const reg=arquivo[id]; if(!reg) return;
    if(db) fila = fila.then(()=>db.collection("procuracoes").doc(id).set(JSON.parse(JSON.stringify(reg)))).then(()=>estado("Arquivado na biblioteca às "+hora())).catch(falhou);
    else if(servidor) fila = fila.then(()=>API("PUT","/api/procuracoes/"+id,reg)).then(()=>estado("Arquivado no servidor do cartório às "+hora())).catch(e=>{ sujo.add(id); falhou(e); });
  });
  if(modoLocal){ lsGravar(); estado("Salvo neste navegador às "+hora()); }
  renderLista();
}
function excluir(id){
  delete arquivo[id];
  if(db) fila = fila.then(()=>db.collection("procuracoes").doc(id).delete()).catch(()=>{});
  else if(servidor) fila = fila.then(()=>API("DELETE","/api/procuracoes/"+id)).catch(e=>toast("Não foi possível excluir: "+e.message));
  else lsGravar();
  if(atual===id){ atual=null; }
  renderLista(); renderMesa(); toast("Procuração excluída");
}
function estado(t){ const el=$("#estado"); el.textContent = t; el.dataset.t = /Não foi|indisponível|desconectado/.test(t) ? "erro" : (/Salvando|Conectando|Modo local|Reconectando/.test(t) ? "aviso" : "ok"); }

// recebe a lista vinda de fora sem perder o que está sendo digitado aqui
function aplicarRemoto(novo){
  sujo.forEach(id=>{ if(arquivo[id]) novo[id]=arquivo[id]; });
  Object.keys(novo).forEach(id=>{ const loc=arquivo[id]; if(loc && String(loc.atualizadoEm||"")>String(novo[id].atualizadoEm||"")) novo[id]=loc; });
  const mudouAtual = atual && arquivo[atual] && novo[atual] && JSON.stringify(novo[atual])!==JSON.stringify(arquivo[atual]);
  arquivo=novo; renderLista();
  if(atual && !arquivo[atual]){ atual=null; renderMesa(); }
  else if(mudouAtual && !(document.activeElement && document.activeElement.closest && document.activeElement.closest(".mesa"))) redesenha();
}

async function iniciar(){
  renderLista(); renderMesa();
  const cl = window.claude;
  if(cl && cl.use){
    try{ db = await cl.use("db"); }catch(e){ db=null; }
    try{ downloads = await cl.use("downloads"); }catch(e){ downloads=null; }
  }
  if(db){
    db.collection("procuracoes").onSnapshot(snap=>{
      const novo={}; snap.docs.forEach(d=>{ const x=d.data(); if(x) novo[d.id]=JSON.parse(JSON.stringify(x)); });
      aplicarRemoto(novo);
      estado("Biblioteca compartilhada · "+Object.keys(arquivo).length+" procuração(ões)");
    }, err=>estado("Biblioteca indisponível: "+err.message));
    db.doc("config/cartorio").onSnapshot(s=>{ const d=s.data(); escreventes=d&&d.escreventes ? JSON.parse(JSON.stringify(d.escreventes)) : []; if(etapa==="ato" && atual) renderMesa(); }, ()=>{});
    return;
  }
  // servidor do cartório?
  if(/^https?:$/.test(location.protocol)){
    try{ const r=await fetch("/api/sessao",{credentials:"same-origin"});
      if(r.status===401){ location.href="/login"; return; }
      if(r.ok && (await r.json()).ok) servidor=true;
    }catch(e){}
  }
  if(servidor){ iniciarServidor(); return; }
  modoLocal = true; arquivo = lsLer();
  try{ escreventes = JSON.parse(localStorage.getItem(LS_KEY+"-esc")||"[]"); }catch(e){ escreventes=[]; }
  estado("Modo local: as procurações ficam salvas apenas neste navegador.");
  renderLista(); renderMesa();
}
async function iniciarServidor(){
  const l=document.createElement("link"); l.rel="manifest"; l.href="/manifest.webmanifest"; document.head.appendChild(l);
  const sair=$("#bt-sair"); sair.hidden=false;
  sair.addEventListener("click", async()=>{ try{ await API("POST","/api/sair",{}); }catch(e){} location.href="/login"; });
  let espera=null;
  const recarregar = async () => {
    try{
      aplicarRemoto(await API("GET","/api/procuracoes"));
      const c=await API("GET","/api/cartorio"); escreventes=c.escreventes||[];
      estado("Servidor do cartório · "+Object.keys(arquivo).length+" procuração(ões)");
    }catch(e){ estado("Servidor desconectado: "+e.message); }
  };
  await recarregar(); renderMesa();
  const ev = new EventSource("/api/eventos");
  ev.onmessage = () => { clearTimeout(espera); espera=setTimeout(recarregar, 300); };
  ev.onerror = () => estado("Reconectando ao servidor do cartório…");
  ev.onopen = () => recarregar();
}
function salvarEscreventes(){
  if(db) db.doc("config/cartorio").set({escreventes}).catch(()=>toast("Não foi possível salvar o cadastro"));
  else if(servidor) API("PUT","/api/cartorio",{escreventes}).catch(()=>toast("Não foi possível salvar o cadastro"));
  else try{ localStorage.setItem(LS_KEY+"-esc", JSON.stringify(escreventes)); }catch(e){}
}

/* ---- biblioteca ---- */
const STATUS = {rascunho:["Rascunho","pend"], conferida:["Conferida","inf"], lavrada:["Lavrada","ok"]};
function nomeParte(o){ return o ? (o.tp==="PJ" ? o.pj.razao : o.pf.nome) : ""; }
function tituloReg(r){ const n=nomeParte(r.outorgantes[0]); return (n||"Sem outorgante").trim(); }
function renderFiltros(){
  const tipos=["todas"].concat([...new Set(Object.values(arquivo).map(r=>r.tipo))].sort());
  $("#filtros").innerHTML = tipos.map(t=>'<button type="button" class="chip'+(filtro===t?" on":"")+'" data-f="'+H(t)+'">'+H(t==="todas"?"Todas":t)+'</button>').join("");
}
function renderLista(){
  renderFiltros();
  const tot=Object.keys(arquivo).length; $("#contagem").textContent = tot ? tot+(tot>1?" atos":" ato") : "";
  const q = termo.toLowerCase().replace(/[.\-\/]/g,"");
  const regs = Object.entries(arquivo).filter(([id,r])=>{
    if(filtro!=="todas" && r.tipo!==filtro) return false;
    if(!q) return true;
    const alvo = [r.tipo].concat(r.outorgantes.concat(r.outorgados).map(o=>o.tp==="PJ"?o.pj.razao+" "+o.pj.cnpj+" "+o.pj.reps.map(x=>x.nome+" "+x.cpf).join(" "):o.pf.nome+" "+o.pf.cpf)).join(" ").toLowerCase().replace(/[.\-\/]/g,"");
    return alvo.includes(q);
  }).sort((a,b)=>String(b[1].atualizadoEm||"").localeCompare(String(a[1].atualizadoEm||"")));
  if(!regs.length){
    $("#lista").innerHTML = '<div class="vazio">'+(Object.keys(arquivo).length ? "Nenhuma procuração encontrada para esta busca." : "Nenhuma procuração arquivada ainda. Escolha um modelo ao lado para lavrar a primeira; ela fica guardada aqui automaticamente.")+'</div>';
    return;
  }
  $("#lista").innerHTML = regs.map(([id,r])=>{
    const m = N.montar(r); const s=STATUS[r.status]||STATUS.rascunho;
    const od = nomeParte(r.outorgados[0]);
    return '<button type="button" class="item'+(id===atual?" on":"")+'" data-id="'+id+'"><b>'+H(tituloReg(r))+'</b><span class="data">'+(r.ato.data?N.dataBR(r.ato.data):'')+'</span>'+
      '<span class="meta">'+H(r.tipo)+(od?' → '+H(od):'')+'</span>'+
      '<span class="meta"><span class="pill '+s[1]+'">'+s[0]+'</span>'+(m.pend.length?'<span class="pill pend">'+m.pend.length+' pendência'+(m.pend.length>1?'s':'')+'</span>':'<span class="pill ok">completa</span>')+'</span></button>';
  }).join("");
}
$("#filtros").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; filtro=b.dataset.f; renderLista(); });
$("#busca").addEventListener("input",e=>{ termo=e.target.value.trim(); renderLista(); });
$("#lista").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(!b) return; atual=b.dataset.id; etapa="ato"; fichaAberta=false; renderLista(); renderMesa(); });
$("#bt-nova").addEventListener("click",()=>{ atual=null; renderLista(); renderMesa(); });

function criar(modeloId){
  const id=uid(); const r=N.novoAto(modeloId);
  r.ato.data=hojeISO(); r.criadoEm=new Date().toISOString();
  if(escreventes.length===1){ r.ato.escNome=escreventes[0].nome; r.ato.escCargo=escreventes[0].cargo; }
  arquivo[id]=r; atual=id; etapa="ato"; salvarDepois(id); renderMesa();
}

/* ---- campos ---- */
function get(obj, path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k], obj); }
function set(obj, path, val){ const ks=path.split("."); const last=ks.pop(); const alvo=ks.reduce((o,k)=>o[k],obj); alvo[last]=val; }
function fid(path){ return "f-"+path.replace(/\./g,"-"); }
function campo(path, label, o){
  o=o||{}; const r=arquivo[atual]; const v=get(r,path); const val=v==null?"":v;
  const cls=["f"]; if(o.cls) cls.push(o.cls); if(o.dado) cls.push("dado"); if(o.larga) cls.push("larga"); if(o.req) cls.push("req");
  if(o.req && N.vazio(val)) cls.push("falta"); if(o.erro) cls.push("erro");
  let ctl;
  if(o.opts) ctl='<select id="'+fid(path)+'" data-p="'+path+'"'+(o.re?' data-re="1"':'')+'><option value="">— selecione —</option>'+o.opts.map(x=>{ const [k,l]=Array.isArray(x)?x:[x,x]; return '<option value="'+H(k)+'"'+(String(val)===String(k)?" selected":"")+'>'+H(l)+'</option>'; }).join("")+'</select>';
  else if(o.ta) ctl='<textarea id="'+fid(path)+'" data-p="'+path+'" placeholder="'+H(o.ph||"")+'">'+H(val)+'</textarea>';
  else ctl='<input id="'+fid(path)+'" data-p="'+path+'" type="'+(o.tipo||"text")+'" value="'+H(val)+'" placeholder="'+H(o.ph||"")+'"'+(o.mask?' data-mask="'+o.mask+'"':'')+(o.list?' list="'+o.list+'"':'')+' autocomplete="off">';
  return '<label class="'+cls.join(" ")+'"><span class="rot">'+H(label)+'</span>'+ctl+(o.dica?'<span class="dica">'+H(o.dica)+'</span>':'')+'</label>';
}
function seg(path, opcoes){
  const r=arquivo[atual]; const v=get(r,path);
  return '<span class="seg" role="group">'+opcoes.map(([k,l])=>'<button type="button" data-seg="'+path+'" data-v="'+k+'" class="'+(v===k?"on":"")+'">'+H(l)+'</button>').join("")+'</span>';
}

function formPF(base, p, modo){
  // modo: "outorgante" | "outorgado" | "rep"
  const cpfErr = !N.vazio(p.cpf) && !N.cpfOk(p.cpf);
  const venc = p.docValidade && arquivo[atual].ato.data && p.docValidade < arquivo[atual].ato.data;
  let h='<div class="grade">';
  h+=campo(base+".nome","Nome completo",{req:1,larga:1});
  if(modo==="rep") h+=campo(base+".cargo","Cargo na empresa",{req:1,ph:"sócio administrador"});
  h+=campo(base+".sexo","Sexo (para concordância)",{opts:[["F","Feminino"],["M","Masculino"]],req:1,re:1});
  h+=campo(base+".nac","Nacionalidade",{req:1,ph:"brasileira"});
  h+=campo(base+".prof","Profissão",{req:1});
  h+=campo(base+".cpf","CPF",{req:1,dado:1,mask:"cpf",erro:cpfErr,dica:cpfErr?"Dígito verificador inválido":"",ph:"000.000.000-00"});
  h+=campo(base+".docTipo","Documento de identidade",{opts:[["CNH","CNH"],["RG","RG"],["RNM","RNM (estrangeiro)"],["PASS","Passaporte"],["OAB","Carteira da OAB"],["OUTRO","Outro"]],req:1,re:1});
  if(p.docTipo==="OUTRO") h+=campo(base+".docOutro","Tipo do documento",{req:1,ph:"Carteira do CRM"});
  if(p.docTipo) h+=campo(base+".docNum",p.docTipo==="CNH"?"Nº de registro da CNH":"Número",{req:1,dado:1});
  if(["RG","RNM","PASS","OUTRO"].includes(p.docTipo)) h+=campo(base+".docOrg","Órgão emissor",{req:1,ph:p.docTipo==="RG"?"SSP":""});
  if(["CNH","RG","OAB"].includes(p.docTipo)) h+=campo(base+".docUF",p.docTipo==="CNH"?"DETRAN (UF)":(p.docTipo==="OAB"?"Seção (UF)":"UF"),{req:1,ph:"SP"});
  if(p.docTipo==="CNH") h+=campo(base+".cnhRg","RG que consta na CNH",{req:1,dado:1,ph:"0000000-SSP/SP"});
  if(p.docTipo) h+=campo(base+".docValidade","Validade do documento",{tipo:"date",erro:venc,dica:venc?"Vencido na data do ato":""});
  if(modo!=="outorgado") h+=campo(base+".nasc","Data de nascimento",{tipo:"date",dica:"Usada só para conferência (idoso/menor)"});
  h+=campo(base+".ec","Estado civil",{opts:[["solteiro","Solteiro(a)"],["casado","Casado(a)"],["divorciado","Divorciado(a)"],["separado","Separado(a) judicialmente"],["viuvo","Viúvo(a)"]],req:1,re:1});
  h+='</div>';
  if(modo!=="outorgado" && p.ec){
    h+='<div class="sub"><div class="grade">';
    if(p.ec==="casado"){
      h+=campo(base+".conjNome","Nome do cônjuge",{req:1});
      h+=campo(base+".regime","Regime de bens",{opts:N.REGIMES,req:1,re:1});
      h+=campo(base+".casData","Data do casamento",{tipo:"date",req:1});
      h+=campo(base+".certMat","Matrícula da certidão de casamento",{req:1,dado:1});
      h+=campo(base+".pacto","Pacto antenupcial (se houver)",{ph:"lavrada no … Tabelião, livro …, fls. …, registrada sob nº …",larga:1});
    } else {
      if(p.ec==="solteiro") h+=campo(base+".certTipo","Certidão de nascimento",{opts:[["inteiro teor","Inteiro teor"],["breve relato","Breve relato"]]});
      h+=campo(base+".certData","Certidão emitida em",{tipo:"date",req:1});
      h+=campo(base+".certMat","Matrícula da certidão",{req:1,dado:1,larga:1});
      h+=campo(base+".ue","União estável",{opts:[["nao","Declara não conviver"],["sim","Convive em união estável"]],req:1,re:1});
      if(p.ue==="sim") h+=campo(base+".ueNome","Nome do(a) companheiro(a)",{req:1});
    }
    h+=campo(base+".nomeCert","Nome como consta na certidão (se diferente)",{dica:"Preencha só para conferir divergência de nome",larga:1});
    h+='</div></div>';
  }
  h+='<div class="grade">';
  h+='</div>'+formEndereco(base, p, p.end)+'<div class="grade">';
  h+=campo(base+".email","E-mail (opcional)",{tipo:"email"});
  h+=campo(base+".tel","Telefone (opcional)",{tipo:"tel"});
  if(modo!=="outorgado") h+=campo(base+".assin","Assinatura",{opts:[["normal","Assina normalmente"],["nao_alfabetizado","Não alfabetizado(a) — a rogo"],["dificuldade","Dificuldade para assinar — a rogo"]],re:1});
  h+='</div>';
  return h;
}
// CEP primeiro: ao completar os 8 dígitos, rua, bairro, cidade e UF são buscados sozinhos
function formEndereco(base, o, antigo){
  const legado = N.vazio(o.endr && o.endr.logr) && !N.vazio(antigo);
  return '<div class="grade-end">'+
    campo(base+".cep","CEP",{req:1,dado:1,mask:"cep",ph:"00000-000",cls:"c-cep",dica:cepMsg[base]||"Digite o CEP para preencher o endereço"})+
    campo(base+".endr.logr","Rua / logradouro",{req:!legado,cls:"c-logr",ph:"Rua, Avenida, Praça…",dica:legado?"Endereço antigo: "+antigo:""})+
    campo(base+".endr.num","Número",{req:!legado,cls:"c-num",ph:"198 ou s/n"})+
    campo(base+".endr.compl","Complemento (opcional)",{cls:"c-compl",ph:"apto 12, bloco B"})+
    campo(base+".endr.bairro","Bairro",{req:!legado,cls:"c-bairro"})+
    campo(base+".endr.cidade","Cidade",{req:!legado,cls:"c-cidade"})+
    campo(base+".endr.uf","UF",{req:!legado,cls:"c-uf",opts:N.UFS})+
  '</div>';
}
function formPJ(base, pj){
  const err = !N.vazio(pj.cnpj) && !N.cnpjOk(pj.cnpj);
  let h='<div class="grade">';
  h+=campo(base+".razao","Razão social",{req:1,larga:1});
  h+=campo(base+".cnpj","CNPJ",{req:1,dado:1,mask:"cnpj",erro:err,dica:err?"Dígito verificador inválido":"",ph:"00.000.000/0000-00"});
  h+=campo(base+".nire","NIRE ou registro no RCPJ",{dado:1});
  h+='</div><h4 class="sub-tit">Endereço da sede</h4>'+formEndereco(base, pj, pj.sede)+'<div class="grade">';
  h+=campo(base+".atoConst","Ato constitutivo (nº e data do registro na JUCESP)",{req:1,larga:1,ph:"registrado na JUCESP sob nº …, em …"});
  h+=campo(base+".ultAlt","Última alteração consolidada (nº e data)",{req:1,larga:1,ph:"registrada sob nº …, em …"});
  h+=campo(base+".certSimpl","Certidão simplificada emitida em",{tipo:"date",req:1});
  h+=campo(base+".clausula","Cláusula que dá poderes para outorgar procuração",{req:1,ph:"Sétima"});
  h+=campo(base+".adm","Administração",{opts:[["isolada","Isolada"],["conjunta","Conjunta"]],re:1});
  h+='</div>';
  pj.reps.forEach((r,i)=>{
    h+='<div class="sub"><div class="bloco-topo"><h3>Representante legal '+(pj.reps.length>1?i+1:"")+'</h3>'+(pj.reps.length>1?'<button type="button" class="mini" data-acao="rmRep" data-base="'+base+'" data-i="'+i+'">Remover</button>':'')+'</div>'+formPF(base+".reps."+i, r, "rep")+'</div>';
  });
  h+='<div><button type="button" class="mini" data-acao="addRep" data-base="'+base+'">+ Representante</button></div>';
  return h;
}
function formPartes(lista, chave, rotulo){
  const r=arquivo[atual];
  let h='';

function copiar(texto, ok){
  const reserva=()=>{ const t=document.createElement("textarea"); t.value=texto; t.style.position="fixed"; t.style.opacity="0"; document.body.appendChild(t); t.select();
    let deu=false; try{ deu=document.execCommand("copy"); }catch(e){} t.remove(); toast(deu?ok:"Não foi possível copiar automaticamente; selecione o texto e use Ctrl+C"); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(texto).then(()=>toast(ok), reserva); else reserva();
}

/* ---- eventos da mesa ---- */
const mesa=$("#mesa");
/* ---- busca de endereço pelo CEP ---- */
const cepMsg = {}; const cepCache = {}; let cepUltimo = {};
async function consultarCep(cep){
  if(cepCache[cep]) return cepCache[cep];
  let d;
  if(servidor) d = await API("GET","/api/cep/"+cep);
  else {
    if(db || window.claude) throw new Error("bloqueado");
    const r = await fetch("https://viacep.com.br/ws/"+cep+"/json/"); const j = await r.json();
    if(!r.ok || j.erro) throw new Error("não encontrado");
    d = {logr:j.logradouro||"", bairro:j.bairro||"", cidade:j.localidade||"", uf:j.uf||""};
  }
  return cepCache[cep] = d;
}
function avisoCep(base, msg){ cepMsg[base]=msg; const el=document.getElementById(fid(base+".cep")); const d=el && el.parentNode.querySelector(".dica"); if(d) d.textContent=msg; }
async function buscarCep(base, cep){
  if(cepUltimo[base]===cep) return; cepUltimo[base]=cep;
  const id=atual; avisoCep(base,"Buscando endereço…");
  try{
    const d = await consultarCep(cep);
    const r = arquivo[id]; if(!r) return;
    const alvo = get(r, base); if(!alvo) return;
    alvo.endr = alvo.endr || {};
    if(d.logr) alvo.endr.logr = d.logr;
    if(d.bairro) alvo.endr.bairro = d.bairro;
    if(d.cidade) alvo.endr.cidade = d.cidade;
    if(d.uf) alvo.endr.uf = d.uf;
    cepMsg[base] = d.logr ? "Endereço encontrado. Confira e informe o número." : "CEP geral da cidade: informe a rua e o bairro.";
    salvarDepois(id);
    if(atual===id){ redesenha(); const n=document.getElementById(fid(base+(d.logr?".endr.num":".endr.logr"))); if(n) n.focus(); }
  }catch(e){
    cepUltimo[base]=null;
    avisoCep(base, e.message==="bloqueado" ? "A busca de CEP não funciona no link do Claude; preencha o endereço (no servidor do cartório ela é automática)." : "CEP não encontrado. Confira o número ou preencha o endereço.");
  }
}
mesa.addEventListener("input",e=>{
  const el=e.target; const p=el.dataset.p; if(!p||!atual) return;
  let v=el.value;
  if(el.dataset.mask==="cpf"){ v=N.fmtCPF(v); el.value=v; }
  if(el.dataset.mask==="cnpj"){ v=N.fmtCNPJ(v); el.value=v; }
  if(el.dataset.mask==="cep"){ v=N.fmtCEP(v); el.value=v; }
  set(arquivo[atual], p, v);
  if(el.dataset.mask==="cep" && v.replace(/\D/g,"").length===8) buscarCep(p.replace(/\.cep$/,""), v.replace(/\D/g,""));
  if(el.tagName!=="SELECT") { const lab=el.closest("label.f"); if(lab) lab.classList.toggle("falta", lab.classList.contains("falta") && !v); }
  salvarDepois(atual);
});
mesa.addEventListener("change",e=>{
  const el=e.target; if(!atual || !arquivo[atual]) return;
  if(el.dataset.doc){ const r=arquivo[atual]; r.docs=r.docs||{}; r.docs[el.dataset.doc]=el.checked; salvarDepois(atual);
    const lab=el.closest(".doc"); if(lab) lab.classList.toggle("feito",el.checked);
    const tot=document.getElementById("docs-cont"); if(tot){ const l=N.documentos(r).flatMap(g=>g.itens); tot.textContent=l.filter(x=>r.docs[x.id]).length+" de "+l.length+" apresentados"; }
    return; }
  if(el.dataset.troca){ aplicarModelo(arquivo[atual], el.value); salvarDepois(atual); setTimeout(()=>{ redesenha(); renderLista(); },0); return; }
  if(!el.dataset.p) return;
  if(el.tagName==="SELECT" && get(arquivo[atual], el.dataset.p)!==el.value){ set(arquivo[atual], el.dataset.p, el.value); salvarDepois(atual); }
  // estrutura muda (selects) ou campos validados: redesenha preservando foco/rolagem
  // datas: o navegador dispara "change" a cada dígito do ano; redesenhar ali joga o cursor de volta para o dia.
  // Por isso a data só atualiza a tela quando o campo perde o foco.
  if(el.type==="date"){ set(arquivo[atual], el.dataset.p, el.value); dataPendente=true; return; }
  if(el.tagName==="SELECT" || el.dataset.mask){ setTimeout(()=>{ redesenha(); renderLista(); },0); }
});
let dataPendente=false;
mesa.addEventListener("focusout",e=>{

  dataPendente=false; setTimeout(()=>{ redesenha(); renderLista(); },0);
});
mesa.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;

  if(b.dataset.etapa){ etapa=b.dataset.etapa; redesenha(); return; }
  const r=arquivo[atual]; if(!r) return;
  if(b.dataset.seg){ set(r,b.dataset.seg,b.dataset.v); salvarDepois(atual); redesenha(); return; }
  const ac=b.dataset.acao; if(!ac) return;
  const i=+b.dataset.i;
  if(ac==="addParte"){ r[b.dataset.chave].push(N.novaParte("PF")); }
  else if(ac==="rmParte"){ r[b.dataset.chave].splice(i,1); }
  else if(ac==="addRep"){ get(r,b.dataset.base).reps.push(N.novaPF({cargo:"sócio administrador"})); }
  else if(ac==="rmRep"){ get(r,b.dataset.base).reps.splice(i,1); }
  else if(ac==="addPoder"){ r.poderes.push({k:b.dataset.k, titulo:N.PODERES[b.dataset.k].titulo, v:{}}); toast("Poder incluído na posição "+r.poderes.length); }
  else if(ac==="rmPoder"){ r.poderes.splice(i,1); }
  else if(ac==="sobe" && i>0){ const t=r.poderes[i]; r.poderes[i]=r.poderes[i-1]; r.poderes[i-1]=t; }
  else if(ac==="desce" && i<r.poderes.length-1){ const t=r.poderes[i]; r.poderes[i]=r.poderes[i+1]; r.poderes[i+1]=t; }
  else if(ac==="flag"){ r.flags[b.dataset.k]=!r.flags[b.dataset.k]; }
  else if(ac==="usarEsc"){ const x=escreventes[i]; r.ato.escNome=x.nome; r.ato.escCargo=x.cargo; }
  else if(ac==="salvarEsc"){ if(N.vazio(r.ato.escNome)||N.vazio(r.ato.escCargo)){ toast("Preencha nome e cargo do escrevente"); return; }
    escreventes=escreventes.filter(x=>x.nome!==r.ato.escNome).concat([{nome:r.ato.escNome.trim(),cargo:r.ato.escCargo.trim()}]); salvarEscreventes(); toast("Escrevente guardado no cadastro"); }
  else if(ac==="confirmar"){ r.fichaOk=true; if(r.status==="rascunho") r.status="conferida"; }
  else if(ac==="desconfirmar"){ r.fichaOk=false; }
  else if(ac==="duplicar"){ const id=uid(); const c=JSON.parse(JSON.stringify(r)); c.status="rascunho"; c.fichaOk=false; c.selo=""; c.cnib={resultado:"",hash:""}; c.criadoEm=new Date().toISOString(); arquivo[id]=c; atual=id; salvarDepois(id); toast("Cópia criada como rascunho"); renderMesa(); return; }
  else if(ac==="excluir"){ if(!b.classList.contains("armado")){ b.classList.add("armado"); b.textContent="Confirmar exclusão"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armado"); b.textContent="Excluir"; } },4000); return; } excluir(atual); return; }
  else if(ac==="docx"){ baixarDocx(r); return; }
  else if(ac==="copiar"){ copiar(N.textoPlano(N.montar(r)), "Texto copiado"); return; }
  else if(ac==="copiarDocs"){ copiar(N.documentosTexto(r,"Documentos para a procuração de "+tituloReg(r)), "Lista copiada"); return; }
  salvarDepois(atual); redesenha();
});
function aplicarModelo(r, id){
  const m=N.MODELOS.find(x=>x.id===id); if(!m || m.id===r.modelo) return;
  const antigos={}; r.poderes.forEach(pd=>{ if(!antigos[pd.k]) antigos[pd.k]=pd; });
  r.modelo=m.id; r.tipo=m.tipo; r.intro=m.intro;
  r.poderes=m.poderes.map(k=>antigos[k]||{k, titulo:N.PODERES[k].titulo, v:{}});
  if(r.outorgantes[0]) r.outorgantes[0].tp=m.ot;
  if(r.outorgados[0]){ r.outorgados[0].tp=m.od; if(m.odDoc && !r.outorgados[0].pf.docTipo) r.outorgados[0].pf.docTipo=m.odDoc; }
  r.fichaOk=false; if(r.status==="conferida") r.status="rascunho";
  toast("Tipo alterado para "+m.nome+" · "+m.sub);
}
function redesenha(){
  // mantém a tela onde está: trava a altura enquanto o conteúdo é trocado e devolve a rolagem
  const y=window.scrollY, ativo=document.activeElement, foco=ativo && ativo.id;
  let sel=null; try{ if(ativo && typeof ativo.selectionStart==="number") sel=[ativo.selectionStart, ativo.selectionEnd]; }catch(e){}
  const mesa=$("#mesa"); mesa.style.minHeight=mesa.offsetHeight+"px";
  renderMesa(); window.scrollTo(0,y);
  if(foco){ const el=document.getElementById(foco); if(el){ el.focus({preventScroll:true}); if(sel) try{ el.setSelectionRange(sel[0], sel[1]); }catch(e){} } }
}

async function baixarDocx(r){
  if(typeof JSZip==="undefined"){ toast("Gerador de Word não carregou. Recarregue a página."); return; }
  const m=N.montar(r); const z=new JSZip();
  Object.entries(N.DOCX_FIXOS).forEach(([k,v])=>z.file(k,v));
  z.file("word/document.xml", N.documentXml(m));
  const blob=await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const nome=("Procuracao "+r.tipo+" - "+tituloReg(r)).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").replace(/\s+/g," ").trim().slice(0,90)+".docx";
  if(downloads){
    try{ await downloads.save({filename:nome, data:blob}); toast("Minuta salva: "+nome); }
    catch(e){ toast(e && e.code==="declined" ? "Download cancelado" : "Não foi possível baixar: "+(e&&e.message||"erro")); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}

iniciar();
})();
</script>
