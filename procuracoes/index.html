<title>Livro de Procurações</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: arquivo (biblioteca) à esquerda como um fichário; mesa de trabalho à direita com etapas do ato notarial. */
:root{
  --papel:#f4f5f1; --folha:#ffffff; --tinta:#16263d; --tinta-2:#4a5568; --linha:#dcdfd6;
  --azul:#1f4e8c; --azul-suave:#e3ebf6; --selo:#a3262a; --selo-suave:#f7e4e3;
  --ambar:#8a5a00; --ambar-suave:#fbefd2; --verde:#1d6b41; --verde-suave:#dff1e6;
  --realce:#fff2a8;
  --f-titulo:"Libre Caslon Text", Georgia, "Times New Roman", serif;
  --f-corpo:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-dado:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-minuta: Tahoma, Verdana, "DejaVu Sans", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#12161c; --folha:#1a2029; --tinta:#e6e9ee; --tinta-2:#a3adbb; --linha:#2c3440;
  --azul:#8fb4ec; --azul-suave:#1f2c40; --selo:#f08a86; --selo-suave:#3a1f22;
  --ambar:#f0c56a; --ambar-suave:#3a2f17; --verde:#7fd3a1; --verde-suave:#173226; --realce:#5a4d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#12161c; --folha:#1a2029; --tinta:#e6e9ee; --tinta-2:#a3adbb; --linha:#2c3440;
  --azul:#8fb4ec; --azul-suave:#1f2c40; --selo:#f08a86; --selo-suave:#3a1f22;
  --ambar:#f0c56a; --ambar-suave:#3a2f17; --verde:#7fd3a1; --verde-suave:#173226; --realce:#5a4d12; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--papel);color:var(--tinta);font:15px/1.5 var(--f-corpo);margin:0}
table{font-size:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100%;
  padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)} .arquivo{border-right:0;border-bottom:1px solid var(--linha);max-height:none}}
.arquivo{border-right:1px solid var(--linha);padding:20px max(16px, env(safe-area-inset-left,0px)) 20px 16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.marca{display:flex;flex-direction:column;gap:2px}
.marca h1{font:700 22px/1.2 var(--f-titulo);margin:0;text-wrap:balance}
.marca small{color:var(--tinta-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.busca{width:100%;padding:9px 11px;border:1px solid var(--linha);border-radius:6px;background:var(--folha)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--linha);background:var(--folha);border-radius:99px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.on{border-color:var(--azul);color:var(--azul);font-weight:600}
.lista{display:flex;flex-direction:column;gap:8px;min-width:0}
.item{display:grid;gap:4px;text-align:left;width:100%;border:1px solid var(--linha);background:var(--folha);border-radius:6px;padding:10px 12px;cursor:pointer}
.item:hover{border-color:var(--azul)}
.item.on{border-color:var(--azul);box-shadow:inset 3px 0 0 var(--azul)}
.item b{font-weight:600;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--tinta-2)}
.vazio{border:1px dashed var(--linha);border-radius:6px;padding:16px;color:var(--tinta-2);font-size:14px}
.estado{font-size:12px;color:var(--tinta-2)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:4px}
.pill.ok{background:var(--verde-suave);color:var(--verde)}
.pill.pend{background:var(--ambar-suave);color:var(--ambar)}
.pill.at{background:var(--selo-suave);color:var(--selo)}
.pill.inf{background:var(--azul-suave);color:var(--azul)}
.mesa{padding:20px max(16px, env(safe-area-inset-right,0px)) 40px 20px;min-width:0;display:flex;flex-direction:column;gap:16px}
@media (max-width:860px){.mesa{padding-left:16px}}
.btn{border:1px solid var(--linha);background:var(--folha);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--azul)}
.btn.p{background:var(--azul);border-color:var(--azul);color:var(--folha)}
.btn.perigo{color:var(--selo)}
.btn.perigo.armado{background:var(--selo);color:var(--folha);border-color:var(--selo)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
h2{font:700 24px/1.25 var(--f-titulo);margin:0;text-wrap:balance}
h3{font:600 13px/1.3 var(--f-corpo);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);margin:0}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.modelo{border:1px solid var(--linha);background:var(--folha);border-radius:8px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.modelo:hover{border-color:var(--azul)}
.modelo b{font:700 16px/1.25 var(--f-titulo)}
.modelo span{font-size:13px;color:var(--tinta-2)}
.modelo .tags{display:flex;gap:4px;flex-wrap:wrap}
.topo{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.topo .acoes{display:flex;gap:8px;flex-wrap:wrap}
.etapas{display:flex;gap:2px;border-bottom:1px solid var(--linha);overflow-x:auto}
.etapas button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--tinta-2);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.etapas button.on{color:var(--tinta);border-bottom-color:var(--azul)}
.etapas button .n{font:500 11px var(--f-dado);margin-right:6px;color:var(--tinta-2)}
.painel{display:flex;flex-direction:column;gap:16px}
.bloco{background:var(--folha);border:1px solid var(--linha);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.bloco-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 12px}
.grade .larga{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;color:var(--tinta-2);min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;font-size:14px;color:var(--tinta);padding:7px 9px;border:1px solid var(--linha);border-radius:5px;background:var(--papel);width:100%}
label.f textarea{min-height:70px;resize:vertical}
label.f.dado input{font-family:var(--f-dado)}
label.f.falta input,label.f.falta select{border-color:var(--ambar)}
label.f.erro input{border-color:var(--selo)}
label.f .dica{font-weight:400;font-size:11px;color:var(--tinta-2)}
label.f.erro .dica{color:var(--selo)}
.seg{display:inline-flex;border:1px solid var(--linha);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--folha);padding:6px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--azul);color:var(--folha)}
.sub{border-left:2px solid var(--linha);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.poder{border:1px solid var(--linha);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--papel)}
.poder-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.poder-topo .num{font:500 13px var(--f-dado);color:var(--tinta-2)}
.poder-topo input{flex:1;min-width:140px;padding:6px 8px;border:1px solid var(--linha);border-radius:5px;background:var(--folha);font-weight:600;text-transform:uppercase}
.mini{border:1px solid var(--linha);background:var(--folha);border-radius:5px;padding:4px 9px;cursor:pointer;font-size:13px}
.prev{font-size:13px;color:var(--tinta-2);line-height:1.45;max-height:4.4em;overflow:hidden}
.biblio{display:flex;gap:6px;flex-wrap:wrap}
.tabela{overflow-x:auto}
.tabela table{border-collapse:collapse;width:100%;min-width:520px}
.tabela th,.tabela td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--linha);vertical-align:top;font-size:13px}
.tabela th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2)}
.tabela td.v{font-family:var(--f-dado);font-size:12.5px;overflow-wrap:anywhere}
.tabela tr.sec td{background:var(--papel);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.alertas{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.alertas li{border-left:3px solid var(--selo);background:var(--selo-suave);padding:8px 10px;border-radius:0 5px 5px 0;font-size:14px}
.alertas li.pend{border-left-color:var(--ambar);background:var(--ambar-suave)}
.folha{background:#fff;color:#111;border:1px solid var(--linha);border-radius:4px;padding:56px 32px 24px 40px;font:13px/1.45 var(--f-minuta);max-width:820px;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow-wrap:anywhere}
.folha .tit{text-align:center;font-weight:700;text-decoration:underline;margin-bottom:14px}
.folha .corpo{text-align:justify}
.folha .ass{text-align:center;margin-top:22px}
.folha mark{background:#fff2a8;color:#111}
.aviso{font-size:13px;color:var(--tinta-2)}
.confirmar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:8px;background:var(--azul-suave)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--papel);padding:9px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.item,.modelo,.btn{transition:border-color .15s}}
</style>

<div class="app">
  <aside class="arquivo" aria-label="Biblioteca">
    <div class="marca"><small>Tabeliã de Notas · Espírito Santo do Pinhal</small><h1>Livro de Procurações</h1></div>
    <button class="btn p" id="bt-nova" type="button">+ Nova procuração</button>
    <input class="busca" id="busca" type="search" placeholder="Buscar por nome, CPF, CNPJ…" aria-label="Buscar">
    <div class="filtros" id="filtros"></div>
    <div class="lista" id="lista"></div>
    <div class="estado" id="estado">Conectando à biblioteca…</div>
  </aside>
  <main class="mesa" id="mesa"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script id="nucleo">
/* ===== Núcleo: redação da minuta, conferência e .docx (sem DOM) ===== */
var N = (function(){
const CIDADE = "nesta cidade e Comarca de Espírito Santo do Pinhal, Estado de São Paulo, à Rua Coronel Joaquim Vergueiro, nº 198, Centro";
const UN = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CT = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function ate999(n){
  if(n<20) return UN[n];
  if(n<100) return DZ[Math.floor(n/10)] + (n%10 ? " e " + UN[n%10] : "");
  if(n===100) return "cem";
  return CT[Math.floor(n/100)] + (n%100 ? " e " + ate999(n%100) : "");
}
function extenso(n){
  if(n<1000) return ate999(n);
  const m = Math.floor(n/1000), r = n%1000;
  const mil = (m===1 ? "" : ate999(m) + " ") + "mil";
  if(!r) return mil;
  return mil + ((r<100 || r%100===0) ? " e " : " ") + ate999(r);
}
const pad = n => String(n).padStart(2,"0");
function parseData(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? {a:+m[1],m:+m[2],d:+m[3]} : null; }
function dataBR(s){ const d=parseData(s); return d ? pad(d.d)+"/"+pad(d.m)+"/"+d.a : ""; }
function anoPonto(a){ const s=String(a); return s.length>3 ? s.slice(0,-3)+"."+s.slice(-3) : s; }
// "aos vinte e dois (22) dias do mês de setembro (09) do ano de dois mil e vinte e seis (2.026)"
function dataExtensoSeg(s){
  const d=parseData(s); if(!d) return null;
  const dia = d.d===1 ? [["ao primeiro "],["(01)",1],[" dia do mês de "]] : [["aos "+extenso(d.d)+" "],["("+pad(d.d)+")",1],[" dias do mês de "]];
  return dia.concat([[MESES[d.m-1]+" "],["("+pad(d.m)+")",1],[" do ano de "+extenso(d.a)+" "],["("+anoPonto(d.a)+")",1]]);
}
const so = s => String(s||"").replace(/\D/g,"");
function cpfOk(v){ const c=so(v); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  for(let t=9;t<11;t++){ let s=0; for(let i=0;i<t;i++) s+= +c[i]*(t+1-i); if(((s*10)%11)%10 !== +c[t]) return false; } return true; }
function cnpjOk(v){ const c=so(v); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const calc=l=>{ let s=0,p=l-7; for(let i=0;i<l;i++){ s+= +c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13]; }
function fmtCPF(v){ const c=so(v).slice(0,11); return c.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1-$2"); }
function fmtCNPJ(v){ const c=so(v).slice(0,14); return c.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2"); }
function fmtCEP(v){ const c=so(v).slice(0,8); return c.replace(/^(\d{5})(\d)/,"$1-$2"); }
function idade(nasc, ref){ const a=parseData(nasc), b=parseData(ref); if(!a||!b) return null;
  let i=b.a-a.a; if(b.m<a.m || (b.m===a.m && b.d<a.d)) i--; return i; }
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim().toUpperCase();
const vazio = v => v===undefined || v===null || String(v).trim()==="";

/* ----- modelos de dados ----- */
function novaPF(extra){ return Object.assign({nome:"",sexo:"",nac:"",prof:"",docTipo:"",docNum:"",docOrg:"",docUF:"",cnhRg:"",docOutro:"",docValidade:"",cpf:"",nasc:"",
  ec:"",certTipo:"inteiro teor",certData:"",certMat:"",conjNome:"",regime:"",casData:"",pacto:"",ue:"",ueNome:"",nomeCert:"",end:"",cep:"",email:"",tel:"",cargo:"",assin:"normal"}, extra||{}); }
function novaPJ(){ return {razao:"",cnpj:"",nire:"",sede:"",cep:"",atoConst:"",ultAlt:"",certSimpl:"",clausula:"",adm:"isolada",reps:[novaPF({cargo:"sócio administrador"})]}; }
function novaParte(tp, extra){ return {tp:tp, pf:novaPF(extra), pj:novaPJ()}; }

const REGIMES = ["comunhão parcial de bens","comunhão universal de bens","separação convencional de bens","separação obrigatória de bens","participação final nos aquestos"];
const CARGOS_ESC = ["Substituta","Substituto","Escrevente Autorizada","Escrevente Autorizado","Escrevente"];

/* ----- concordância ----- */
// grupo de pessoas: g = "M"|"F"; pl = plural
function grupo(lista){ const pl=lista.length>1; const g = lista.length && lista.every(x=>x==="F") ? "F" : "M"; return {g, pl}; }
function W(gr, ms, fs, mp, fp){ return gr.pl ? (gr.g==="F"?fp:mp) : (gr.g==="F"?fs:ms); }
function sx(p){ return p.sexo==="M" ? "M" : (p.sexo==="F" ? "F" : "M"); }
const g1 = (p, m, f) => p.sexo==="F" ? f : (p.sexo==="M" ? m : m.replace(/o$/,"o(a)"));
function genNac(p){ const n=(p.nac||"").trim(); const low=n.toLowerCase();
  if(low==="brasileiro"||low==="brasileira") return p.sexo==="F" ? "brasileira" : (p.sexo==="M" ? "brasileiro" : n); return n; }

/* ----- biblioteca de poderes ----- */
// cada texto recebe c (contexto de concordância) e v (variáveis) e devolve segmentos [[texto,negrito?]]
const PODERES = {
  reparticoes:{nome:"Repartições públicas", titulo:"REPARTIÇÕES PÚBLICAS", vars:[],
    txt:(c)=>[["representá-"+c.L+" perante as repartições públicas federais, estaduais, municipais, autárquicas, Prefeitura Municipal, Detran, Ciretran, Delegacias de Polícia e de Trânsito, Justiça Trabalhista; JUNTA COMERCIAL DO ESTADO DE SÃO PAULO – JUCESP, PROCON e ACIRP, INSS - Instituto Nacional do Seguro Social, RECEITA FEDERAL DO BRASIL, Consulados, empresas aéreas, empresas de telefonia, Secretaria da Receita Federal, e outras, nelas requerer, pagar, alegar e assinar o que mister for; assumir compromissos e obrigações; fazer acordos ou composições: prestar informações e declarações de residência e rendimentos;"]]},
  banco:{nome:"Banco (conta específica)", titulo:"BANCO", vars:[{n:"banco",l:"Banco",ph:"BANCO DO BRASIL S/A",req:1},{n:"agencia",l:"Agência",req:1},{n:"conta",l:"Conta nº",req:1}],
    txt:(c,v,P)=>[["representá-"+c.L+" perante o "],P(v.banco,"nome do banco"),[", agência "],P(v.agencia,"agência"),[", com a finalidade de movimentar a conta sob o nº "],P(v.conta,"número da conta"),
      [", podendo emitir e endossar cheques: autorizar débitos e créditos; reconhecer saldos e solicitar extratos, efetuar depósitos e retiradas; requisitar e retirar talões de cheques; tomar saques; cadastrar senhas (sejam de cartões de débitos ou de créditos, inclusive assinatura eletrônica); emitir e receber ordens e contraordens de pagamento; promover empréstimos bancários; fazer recadastramentos e aplicações em Bancos e Instituições Financeiras; assinar toda a documentação da praxe bancária; receber tudo quando qualquer título "+c.LHE+" seja devido e dar quitação, perante qualquer pessoa física ou jurídica; fazer e assinar a Declaração do Imposto de Renda, receber notificação e cheque de restituição, se for o caso; retirar qualquer correspondência "+c.DA+", com ou sem valor, inclusive vales postais e encomendas; receber toda e qualquer importância "+c.AO+" destinada, oriundo de qualquer pagamento efetuado pela Previdência Social: podendo receber, dar recibo e quitação: concordar ou não com descontos; apresentar provas e exibir documentos; assinar guias, requerimentos, papeis, livros e folhas próprios, proceder a retirada de carnês e cartão magnético, cadastrar senhas: inclusive recadastramento necessário, requerer benefícios interpor recursos; resgatar, aplicar, reaplicar, transferir e movimentar investimentos, aplicações financeiras, LCA, CDB, fundos de investimento e demais produtos financeiros de titularidade "+c.DA+";"]]},
  advogado:{nome:"Constituir advogado", titulo:"CONSTITUIR ADVOGADO", vars:[],
    txt:(c)=>[[(c.pPl?"Poderão":"Poderá")+" ainda, "+c.REF+", constituir advogados com os poderes da cláusula \"Ad-Judicia\" e \"Ad-judicia et-extra\" para o foro, em qualquer juízo, Instância ou Tribunal, inclusive na justiça do Trabalho, na defesa dos interesses "+c.DA+", podendo propor contra quem de direito as ações competentes e defendê-"+c.L+" nas contrárias, seguindo umas e outras até final decisão e usando os poderes especiais para transigir, recorrer, alegar, firmar compromissos ou acordos; representar em audiências;"]]},
  inss:{nome:"INSS", titulo:"INSS", vars:[{n:"nb",l:"Nº do benefício (NB) — opcional"}],

function montar(a){
  const pend = []; const seg = [];
  const add = (t,b) => { if(t) seg.push({t, b:!!b}); };
  const P = (val, desc) => { if(vazio(val)){ pend.push(desc); return ["[PENDENTE: "+desc+"]", 0, 1]; } return [String(val).trim()]; };
  const put = arr => arr.forEach(x => { if(Array.isArray(x)){ if(x[0]) seg.push({t:x[0], b:!!x[1], p:!!x[2]}); } });
  const PB = (val, desc) => { const r=P(val,desc); r[1]=1; return r; };

  // pessoas físicas que comparecem (outorgantes PF + representantes de PJ)
  const presentes = [];
  a.outorgantes.forEach(o => { if(o.tp==="PF") presentes.push(o.pf); else o.pj.reps.forEach(r=>presentes.push(r)); });
  const gOut = grupo(a.outorgantes.map(o => o.tp==="PJ" ? "F" : sx(o.pf)));
  const gPres = grupo(presentes.map(sx));
  const gProc = grupo(a.outorgados.map(o => o.tp==="PJ" ? "F" : sx(o.pf)));
  const c = {
    L: W(gOut,"lo","la","los","las"),
    DA: W(gOut,"do outorgante","da outorgante","dos outorgantes","das outorgantes"),
    AO: W(gOut,"ao outorgante","à outorgante","aos outorgantes","às outorgantes"),
    A: W(gOut,"o outorgante","a outorgante","os outorgantes","as outorgantes"),
    DELA: W(gOut,"dele outorgante","dela outorgante","deles outorgantes","delas outorgantes"),
    ELA: W(gOut,"ele outorgante","ela outorgante","eles outorgantes","elas outorgantes"),
    LHE: gOut.pl ? "lhes" : "lhe",
    PROC: W(gProc,"o nomeado procurador","a nomeada procuradora","os nomeados procuradores","as nomeadas procuradoras"),
    REF: W(gProc,"referido procurador","referida procuradora","referidos procuradores","referidas procuradoras"),
    pPl: gProc.pl
  };
  const tag = (i, lista, nome) => lista.length>1 ? nome+" "+(i+1) : nome;

  function docSeg(p, quem){
    const portador = g1(p,"portador","portadora");
    const cpf = [["CPF/MF nº "+(vazio(p.cpf)?"":fmtCPF(p.cpf)), 1]]; if(vazio(p.cpf)){ cpf[0][0]="CPF/MF nº "; cpf.push(PB("", "CPF de "+quem)); }
    const t = p.docTipo;
    if(!t) return [P("", "tipo e número do documento de identidade de "+quem),[" e "]].concat(cpf);
    const num = PB(p.docNum, "número do documento de identidade de "+quem);
    if(t==="CNH") return [[portador+" da Carteira Nacional de Habilitação-CNH, "],["registro n° ",1],num,[", emitida pelo DETRAN-"],P(p.docUF,"UF do DETRAN emissor da CNH de "+quem),[", da qual consta o "],["Documento de Identidade nº ",1],PB(p.cnhRg,"RG constante da CNH de "+quem),[" e "]].concat(cpf);
    if(t==="RG") return [[portador+" da "],["Cédula de Identidade RG nº ",1],num,["-",1],PB(p.docOrg,"órgão emissor do RG de "+quem),["/",1],PB(p.docUF,"UF do RG de "+quem),[" e "+g1(p,"inscrito","inscrita")+" no "]].concat(cpf);
    if(t==="RNM") return [[portador+" do "],["Registro Nacional Migratório-RNM nº ",1],num,["-",1],PB(p.docOrg,"órgão emissor do RNM de "+quem),[" e "+g1(p,"inscrito","inscrita")+" no "]].concat(cpf);
    if(t==="PASS") return [[portador+" do "],["Passaporte nº ",1],num,[", expedido por "],P(p.docOrg,"país/órgão emissor do passaporte de "+quem),[", e "+g1(p,"inscrito","inscrita")+" no "]].concat(cpf);
    if(t==="OAB") return [[g1(p,"advogado","advogada")+" "+g1(p,"inscrito","inscrita")+" na "],["Ordem dos Advogados do Brasil, Seção de ",1],PB(p.docUF,"Seção (UF) da OAB de "+quem),[", sob nº ",1],num,[", e no "]].concat(cpf);
    if(t==="OUTRO") return [[portador+" do "],PB(p.docOutro,"tipo do documento de "+quem),[" nº ",1],num,[", expedido por "],P(p.docOrg,"órgão emissor do documento de "+quem),[" e "+g1(p,"inscrito","inscrita")+" no "]].concat(cpf);
    return [P("", "tipo e número do documento de identidade de "+quem),[" e "]].concat(cpf);
  }
  function ecCompleto(p, quem){
    const ec=p.ec, sx_=x=>g1(p,x,x.replace(/o$/,"a"));
    const cert = (desc) => [[", conforme certidão "+desc+" emitida aos "],P(dataBR(p.certData),"data de emissão da certidão de "+quem),[", matrícula nº "],P(p.certMat,"matrícula da certidão de "+quem)];
    let r;
    if(ec==="solteiro") r=[[", declara-se "+sx_("solteiro")]].concat(cert((p.certTipo==="breve relato"?"de breve relato":"de inteiro teor")+" de nascimento"));
    else if(ec==="divorciado") r=[[", declara-se "+sx_("divorciado")]].concat(cert("de casamento com averbação do divórcio"));
    else if(ec==="separado") r=[[", declara-se "+g1(p,"separado judicialmente","separada judicialmente")]].concat(cert("de casamento com averbação da separação"));
    else if(ec==="viuvo") r=[[", declara-se "+g1(p,"viúvo","viúva")]].concat(cert("de casamento com averbação do óbito"));
    else if(ec==="casado"){
      r=[[", "+sx_("casado")+" com "],P(p.conjNome,"nome do cônjuge de "+quem),[", sob o regime da "],P(p.regime,"regime de bens de "+quem),[", em "],P(dataBR(p.casData),"data do casamento de "+quem)];
      if(!vazio(p.pacto)) r.push([", conforme escritura de pacto antenupcial "+p.pacto]);
      r.push([", conforme certidão de casamento matrícula nº "]); r.push(P(p.certMat,"matrícula da certidão de casamento de "+quem));
      return r.concat([[","]]);
    } else return [[", "],P("", "estado civil de "+quem),[","]];
    if(p.ue==="sim") r=r.concat([[", e conviver em união estável com "],P(p.ueNome,"nome do(a) companheiro(a) de "+quem),[","]]);
    else if(p.ue==="nao") r.push([", e não conviver como se "+sx_("casado")+" fosse (união estável),"]);
    else r=r.concat([[", "],P("", "declaração sobre união estável de "+quem),[","]]);
    return r;
  }
  function ecCurto(p, quem){
    const m = {solteiro:g1(p,"solteiro","solteira"),casado:g1(p,"casado","casada"),divorciado:g1(p,"divorciado","divorciada"),viuvo:g1(p,"viúvo","viúva"),separado:g1(p,"separado judicialmente","separada judicialmente")}[p.ec];
    return m ? [[m+", "]] : [P("", "estado civil de "+quem),[", "]];
  }
  function endSeg(p, quem){
    const r=[[" "+g1(p,"residente e domiciliado","residente e domiciliada")+" na "],P(p.end,"endereço de "+quem),[", CEP "],P(vazio(p.cep)?"":fmtCEP(p.cep),"CEP de "+quem)];
    if(!vazio(p.email)) r.push([", e-mail "+p.email.trim()]);
    if(!vazio(p.tel)) r.push([", telefone "+p.tel.trim()]);
    return r;
  }
  function qualPF(p, quem, completo){
    let r=[PB(vazio(p.nome)?"":p.nome.trim().toUpperCase(), "nome completo de "+quem),[", "],P(genNac(p),"nacionalidade de "+quem),[", "],P(p.prof,"profissão de "+quem),[", "]];
    if(completo){ r=r.concat(docSeg(p,quem)).concat(ecCompleto(p,quem)); }
    else { r=r.concat(ecCurto(p,quem)).concat(docSeg(p,quem)).concat([[","]]); }
    return r.concat(endSeg(p,quem));
  }
  function qualPJ(pj, quem){
    let r=[PB(vazio(pj.razao)?"":pj.razao.trim().toUpperCase(),"razão social de "+quem),[", pessoa jurídica de direito privado, inscrita no "],["CNPJ sob nº ",1],PB(vazio(pj.cnpj)?"":fmtCNPJ(pj.cnpj),"CNPJ de "+quem),
      [", com sede na "],P(pj.sede,"endereço da sede de "+quem),[", CEP "],P(vazio(pj.cep)?"":fmtCEP(pj.cep),"CEP da sede de "+quem)];
    if(!vazio(pj.nire)) r.push([", NIRE "+pj.nire.trim()]);
    r=r.concat([[", com seu ato constitutivo "],P(pj.atoConst,"registro do ato constitutivo de "+quem),[" e última alteração contratual consolidada "],P(pj.ultAlt,"registro da última alteração consolidada de "+quem),
      [", conforme certidão simplificada expedida pela JUCESP em "],P(dataBR(pj.certSimpl),"data da certidão simplificada de "+quem),
      [", neste ato representada, nos termos da cláusula "],P(pj.clausula,"cláusula do contrato social que confere poderes, de "+quem),[" do seu contrato social, por "]]);
    pj.reps.forEach((rp,i)=>{
      const qr = "representante"+(pj.reps.length>1?" "+(i+1):"")+" de "+quem;
      if(i) r.push(["; e por "]);
      r.push([(rp.sexo==="F"?"sua ":"seu ")]); r.push(P(rp.cargo,"cargo do "+qr)); r.push([" "]);
      r=r.concat(qualPF(rp, qr, true));
    });
    if(pj.adm==="conjunta" && pj.reps.length>1) r.push([", que assinam em conjunto, na forma do contrato social"]);
    return r;
  }

  // título
  const titulo = "PROCURAÇÃO PÚBLICA COMO ADIANTE SE CONTÉM E DECLARA";
  // abertura
  add("SAIBAM",1); add(" quantos este público instrumento de procuração bastante virem que ");
  const dt = dataExtensoSeg(a.ato.data);
  if(dt) put(dt); else put([P("", "data do ato")]);
  add(", "+CIDADE+", perante mim, ");
  put([P(a.ato.escCargo,"cargo do escrevente que lavra")]);
  add(" da Tabeliã De Notas e De Protesto de Letras e Títulos que esta subscreve, como "+(a.outorgantes.length>1?"outorgantes compareceram":"outorgante compareceu")+": ");
  a.outorgantes.forEach((o,i)=>{
    const quem = tag(i,a.outorgantes,"outorgante");
    if(i) add("; e ");
    put(o.tp==="PJ" ? qualPJ(o.pj,quem) : qualPF(o.pf,quem,true));
  });
  add(". ");
  add(W(gPres,"O presente, maior e capaz, reconhecido como o próprio","A presente, maior e capaz, reconhecida como a própria","Os presentes, maiores e capazes, reconhecidos como os próprios","As presentes, maiores e capazes, reconhecidas como as próprias")+" de que trato, tendo em vista os documentos originais ora apresentados, do que de tudo dou fé. ");
  add("E, "+W(gOut,"pelo outorgante","pela outorgante","pelos outorgantes","pelas outorgantes")+", me foi dito que por este público instrumento de procuração e na melhor forma de direito, "+(gOut.pl?"nomeiam e constituem ":"nomeia e constitui ")+W(gProc,"seu bastante procurador","sua bastante procuradora","seus bastantes procuradores","suas bastantes procuradoras")+": ");
  a.outorgados.forEach((o,i)=>{
    const quem = tag(i,a.outorgados,"outorgado");
    if(i) add("; e ");
    put(o.tp==="PJ" ? qualPJ(o.pj,quem) : qualPF(o.pf,quem,false));
  });
  if(a.outorgados.length>1){
    if(a.atuacao==="conjunto") add("; os quais deverão agir sempre em conjunto");
    else if(a.atuacao==="isoladamente") add("; os quais poderão agir em conjunto ou isoladamente, independentemente da ordem de nomeação");
    else { add("; "); put([P("", "forma de atuação dos procuradores (em conjunto ou isoladamente)")]); }
  }
  const quem_ = gProc.pl ? "a quem conferem" : "a quem confere";
  const conf = gOut.pl ? "a quem conferem" : "a quem confere";
  void quem_;
  const intro = {
    amplos: conf+" amplos e gerais poderes para gerir, administrar todos os negócios e interesses "+c.DA+"; podendo para tanto "+c.PROC+": ",
    amplos_especiais: conf+" amplos, gerais e especiais poderes para gerir, administrar todos os negócios e interesses "+c.DA+"; podendo para tanto "+c.PROC+": ",

  else if(a.flags.irrevogavel) add("A presente procuração é outorgada em caráter irrevogável e irretratável, nos termos dos artigos 683 e 684 do Código Civil; ");

  const SUB = {VEDADO:"VEDADO SUBSTABELECIMENTO.", COM:"PERMITIDO SUBSTABELECIMENTO, COM RESERVA DE IGUAIS PODERES.", SEM:"PERMITIDO SUBSTABELECIMENTO, SEM RESERVA DE PODERES."}[a.substab];
  if(SUB) add(SUB,1); else put([PB("", "cláusula de substabelecimento")]);
  add(" ");

  add(" Os elementos declaratórios, qualificações, identificações, inclusive poderes contidos no presente instrumento foram solicitados e fornecidos "+W(gOut,"pelo outorgante","pela outorgante","pelos outorgantes","pelas outorgantes")+", sendo inalteráveis após a assinatura e a emissão de traslado, responsabilizando-se assim "+c.A+" por qualquer incorreção; assim, cientifica-se que eventuais correções somente serão levadas a efeito mediante a lavratura com cobrança de novo ato. ");
  add("DA INDISPONIBILIDADE:",1);
  const docsCnib = a.outorgantes.map(o=>o.tp==="PJ"?"CNPJ":"CPF");
  const tipoDoc = docsCnib.every(x=>x==="CPF") ? "CPF" : (docsCnib.every(x=>x==="CNPJ") ? "CNPJ" : "CPF/CNPJ");
  add(" Certifico que foi realizada a consulta na central de indisponibilidade, nos termos do Provimento CG. nº 13/2012, "+(a.outorgantes.length>1?"nos "+tipoDoc+" "+c.DA:"no "+tipoDoc+" "+c.DA)+", com resultado ");
  put([P(a.cnib.resultado,"resultado da consulta CNIB")]); add(", conforme Código hash: "); put([P(a.cnib.hash,"código hash da CNIB")]); add(". ");
  const rogo = presentes.filter(p=>p.assin && p.assin!=="normal");

    put([PB(a.rogo.nome,"nome de quem assina a rogo"),[", "],P(a.rogo.qualif,"qualificação de quem assina a rogo"),[", na presença das testemunhas instrumentárias "],P(a.rogo.t1,"testemunha 1 (nome e documento)"),[" e "],P(a.rogo.t2,"testemunha 2 (nome e documento)"),[". "]]);
  }
  add(gPres.pl ? "De como assim o disseram, dou fé, me pediram e eu lhes lavrei o presente instrumento público de procuração que, depois de lido e achado conforme, aceitam, outorgam e assinam, do que de tudo dou fé. "
               : "De como assim o disse, dou fé, me pediu e eu lhe lavrei o presente instrumento público de procuração que, depois de lido e achado conforme, aceita, outorga e assina, do que de tudo dou fé. ");
  add("Eu, ______________________, ");
  put([PB(vazio(a.ato.escNome)?"":a.ato.escNome.trim().toUpperCase(),"nome do escrevente")]);
  add(", "); put([P(a.ato.escCargo,"cargo do escrevente")]); add(" da Tabeliã, lavrei, conferi, subscrevo e assino. ");
  // emolumentos
  add("Emolumentos: ",1);
  EMOL.forEach(([k,l],i)=>{ add(l+": R$ "+(vazio(a.emol[k])?"":a.emol[k].trim()),1); if(vazio(a.emol[k])) seg.push({t:"[PENDENTE]",b:true,p:true}); add(i<EMOL.length-1?" / ":" / ",1); });
  add("Total: R$ "+(vazio(a.emol.total)?"":a.emol.total.trim()),1); if(vazio(a.emol.total)) seg.push({t:"[PENDENTE]",b:true,p:true}); add(". ",1);

    else ass.push({nome: vazio(o.pf.nome)?"[PENDENTE: outorgante]":o.pf.nome.trim().toUpperCase(), sub: o.pf.assin!=="normal" ? "(assina a rogo)" : ""});
  });

  ass.push({nome: vazio(a.ato.escNome)?"[PENDENTE: escrevente]":a.ato.escNome.trim().toUpperCase(), sub:""});
  if(vazio(a.selo)) pend.push("Selo Digital (aposto na lavratura)");
  return {titulo, seg, ass, pend:[...new Set(pend)]};
}

/* ----- conferência ----- */
function conferir(a){
  const rows=[], alertas=[];
  const ref = a.ato.data;
  const st = (v, ok) => vazio(v) ? "PENDENTE" : (ok===false ? "ATENÇÃO" : "OK");
  const R = (campo, valor, status, nota) => rows.push({campo, valor: vazio(valor)?"—":String(valor), status, nota:nota||""});
  const S = t => rows.push({sec:t});
  const at = t => alertas.push(t);

  S("Ato");
  R("Tipo de procuração", a.tipo, st(a.tipo));
  R("Data do ato", dataBR(ref), st(ref));
  R("Escrevente que lavra", a.ato.escNome, st(a.ato.escNome));
  R("Cargo do escrevente", a.ato.escCargo, st(a.ato.escCargo));

  function pf(p, quem, completo, eOutorgante){
    R(quem+" — nome", p.nome, st(p.nome));
    R(quem+" — sexo (concordância)", {F:"feminino",M:"masculino"}[p.sexo]||"", st(p.sexo));
    R(quem+" — nacionalidade", genNac(p), st(p.nac));
    R(quem+" — profissão", p.prof, st(p.prof));
    const dn = {CNH:"CNH",RG:"RG",RNM:"RNM",PASS:"Passaporte",OAB:"OAB",OUTRO:p.docOutro||"Outro"}[p.docTipo]||"";
    R(quem+" — documento", dn ? dn+" nº "+(p.docNum||"?")+(p.docOrg?" "+p.docOrg:"")+(p.docUF?"/"+p.docUF:"") : "", vazio(p.docTipo)||vazio(p.docNum) ? "PENDENTE" : "OK");
    if(p.docTipo==="CNH") R(quem+" — RG constante da CNH", p.cnhRg, st(p.cnhRg));
    if(!vazio(p.docValidade)){
      const venc = ref && p.docValidade < ref;
      R(quem+" — validade do documento", dataBR(p.docValidade), venc?"ATENÇÃO":"OK", venc?"vencido na data do ato":"");
      if(venc) at(quem+": documento de identidade vencido em "+dataBR(p.docValidade)+". A CNH vencida há mais de 30 dias não serve como identificação; exija documento válido.");
    }
    const cpfv = vazio(p.cpf) ? null : cpfOk(p.cpf);
    R(quem+" — CPF", vazio(p.cpf)?"":fmtCPF(p.cpf), st(p.cpf, cpfv), cpfv===false?"dígito verificador inválido":"");
    if(cpfv===false) at(quem+": CPF "+fmtCPF(p.cpf)+" com dígito verificador inválido. Confira no documento original.");
    const ecn = {solteiro:"solteiro(a)",casado:"casado(a)",divorciado:"divorciado(a)",viuvo:"viúvo(a)",separado:"separado(a) judicialmente"}[p.ec]||"";
    R(quem+" — estado civil", ecn, st(p.ec));
    if(completo){
      if(p.ec==="casado"){
        R(quem+" — cônjuge", p.conjNome, st(p.conjNome));
        R(quem+" — regime de bens", p.regime, st(p.regime));
        R(quem+" — data do casamento", dataBR(p.casData), st(p.casData));
        R(quem+" — matrícula da certidão", p.certMat, st(p.certMat));
        const exigePacto = p.regime && p.regime!=="comunhão parcial de bens" && p.regime!=="separação obrigatória de bens";
        const pos77 = p.casData && p.casData >= "1977-12-26";
        if(exigePacto && pos77 && vazio(p.pacto)){ R(quem+" — pacto antenupcial", "", "ATENÇÃO", "regime exige pacto"); at(quem+": casamento após a Lei 6.515/77 sob "+p.regime+" exige pacto antenupcial. Informe a escritura e o registro do pacto."); }
      } else if(p.ec){
        R(quem+" — certidão (data de emissão)", dataBR(p.certData), st(p.certData));
        R(quem+" — certidão (matrícula)", p.certMat, st(p.certMat));
        R(quem+" — união estável", {sim:"convive com "+(p.ueNome||"?"),nao:"declara não conviver"}[p.ue]||"", st(p.ue));
      }
      if(!vazio(p.nomeCert) && norm(p.nomeCert)!==norm(p.nome)){
        R(quem+" — nome na certidão", p.nomeCert, "ATENÇÃO", "diverge do documento de identidade");
        at(quem+": o nome na certidão (\""+p.nomeCert+"\") diverge do nome no documento de identidade (\""+p.nome+"\"). Verifique averbação de alteração de nome antes de lavrar.");
      }
    }
    R(quem+" — endereço", p.end, st(p.end));
    R(quem+" — CEP", vazio(p.cep)?"":fmtCEP(p.cep), st(p.cep, vazio(p.cep)||so(p.cep).length===8), "");
    if(eOutorgante){
      const id = idade(p.nasc, ref);
      if(id!==null) R(quem+" — idade na data do ato", id+" anos", "OK");
      if(id!==null && id>=60) at(quem+" tem "+id+" anos. Avalie a capacidade com cautela; se houver dificuldade de assinatura, providencie assinante a rogo e duas testemunhas.");
      if(id!==null && id<18) at(quem+" tem "+id+" anos (menor). Procuração por menor exige representação ou assistência dos pais/tutor.");
      if(p.assin==="nao_alfabetizado") at(quem+" não é alfabetizado(a): é obrigatório o assinante a rogo e duas testemunhas instrumentárias, com colheita da impressão digital.");
      if(p.assin==="dificuldade") at(quem+" tem dificuldade para assinar: registre o assinante a rogo e duas testemunhas.");
    }
  }
  function pj(o, quem){
    const v = vazio(o.cnpj) ? null : cnpjOk(o.cnpj);
    R(quem+" — razão social", o.razao, st(o.razao));
    R(quem+" — CNPJ", vazio(o.cnpj)?"":fmtCNPJ(o.cnpj), st(o.cnpj, v), v===false?"dígito verificador inválido":"");
    if(v===false) at(quem+": CNPJ "+fmtCNPJ(o.cnpj)+" com dígito verificador inválido. Confira no cartão CNPJ.");
    R(quem+" — NIRE", o.nire, vazio(o.nire)?"PENDENTE":"OK");
    R(quem+" — sede", o.sede, st(o.sede));
    R(quem+" — ato constitutivo (JUCESP)", o.atoConst, st(o.atoConst));
    R(quem+" — última alteração consolidada", o.ultAlt, st(o.ultAlt));
    R(quem+" — certidão simplificada", dataBR(o.certSimpl), st(o.certSimpl));
    if(o.certSimpl && ref){ const d1=new Date(o.certSimpl), d2=new Date(ref); const dias=(d2-d1)/864e5;
      if(dias>30) at(quem+": a certidão simplificada da JUCESP tem mais de 30 dias ("+Math.round(dias)+"). Peça certidão atualizada."); }
    R(quem+" — cláusula de poderes", o.clausula, vazio(o.clausula)?"ATENÇÃO":"OK", vazio(o.clausula)?"confira no contrato social":"");
    if(vazio(o.clausula)) at(quem+": indique a cláusula do contrato social que dá ao representante poderes para outorgar procuração.");
    R(quem+" — administração", o.adm==="conjunta"?"conjunta":"isolada", "OK");
    if(o.adm==="conjunta" && o.reps.length<2) at(quem+": a administração é conjunta, mas só há um representante. Todos os administradores exigidos pelo contrato social devem comparecer e assinar.");
    o.reps.forEach((r,i)=>{ const qr="Representante"+(o.reps.length>1?" "+(i+1):"")+" ("+quem+")"; R(qr+" — cargo", r.cargo, st(r.cargo)); pf(r, qr, true, true); });
  }
  a.outorgantes.forEach((o,i)=>{ const q="Outorgante"+(a.outorgantes.length>1?" "+(i+1):""); S(q+(o.tp==="PJ"?" (pessoa jurídica)":" (pessoa física)")); o.tp==="PJ" ? pj(o.pj,q) : pf(o.pf,q,true,true); });
  a.outorgados.forEach((o,i)=>{ const q="Outorgado"+(a.outorgados.length>1?" "+(i+1):""); S(q+(o.tp==="PJ"?" (pessoa jurídica)":" (pessoa física)")); o.tp==="PJ" ? pj(o.pj,q) : pf(o.pf,q,false,false); });
  if(a.outorgados.length>1){ R("Atuação dos procuradores", {conjunto:"em conjunto",isoladamente:"em conjunto ou isoladamente"}[a.atuacao]||"", st(a.atuacao)); }

  S("Poderes");
  if(!a.poderes.length) R("Poderes", "", "PENDENTE");
  a.poderes.forEach((pd,i)=>{
    const def=PODERES[pd.k]; if(!def) return;
    const faltam = def.vars.filter(x=>x.req && vazio((pd.v||{})[x.n])).map(x=>x.l);
    R((i+1)+") "+(pd.titulo||def.nome), faltam.length?"faltam: "+faltam.join(", "):"completo", faltam.length?(def.veic||def.imovel?"ATENÇÃO":"PENDENTE"):"OK");
    if(def.veic && faltam.length) at("Veículo: faltam "+faltam.join(", ")+". Placa, RENAVAM, chassi, marca/modelo e ano devem constar exatamente como no CRV/CRLV.");
    if(def.imovel){
      at("Venda de imóvel: exige poderes expressos e especiais (art. 661, §1º, CC), com descrição do imóvel, matrícula e Cartório de Registro de Imóveis"+(faltam.length?" — faltam: "+faltam.join(", "):"")+".");
      const casados=[]; a.outorgantes.forEach(o=>{ const ps=o.tp==="PF"?[o.pf]:[]; ps.forEach(p=>{ if(p.ec==="casado") casados.push(p); if(p.ue==="sim") at((p.nome||"Outorgante")+" declara união estável: avalie a anuência do(a) companheiro(a) (art. 1.725 c/c 1.647, I, CC; STJ)."); }); });
      if(a.outorgantes.some(o=>o.tp==="PJ")) at("Imóvel de pessoa jurídica: confira se o contrato social autoriza o administrador a alienar imóveis ou se exige deliberação dos sócios (art. 1.015 CC); exija a certidão simplificada atualizada.");
      casados.forEach(p=>{ if(p.regime!=="separação convencional de bens") at((p.nome||"Outorgante")+" é casado(a) sob "+(p.regime||"regime não informado")+": a alienação de imóvel exige a outorga do cônjuge (art. 1.647, I, CC). O cônjuge deve comparecer como outorgante ou anuente."+(p.regime==="participação final nos aquestos"?" Verifique se o pacto dispensa a outorga (art. 1.656 CC).":"")); });
    }
  });
  if(a.flags.causaPropria) at("Procuração em causa própria (art. 685 CC): é irrevogável, não se extingue pela morte das partes e dispensa prestação de contas; equivale, na prática, à transmissão do direito. Exige preço e objeto determinados e o recolhimento do imposto de transmissão quando for o caso.");
  if(a.flags.irrevogavel && !a.flags.causaPropria) at("Cláusula de irrevogabilidade (arts. 683 e 684 CC): a revogação gera perdas e danos e, se a cláusula for condição de negócio bilateral, a revogação é ineficaz. Confirme que o outorgante compreende o efeito.");
  if(a.flags.citacao) at("Poder para receber citação: a citação feita ao procurador vale como citação pessoal do outorgante (art. 242 CPC). Advirta o outorgante.");

  S("Encerramento");
  R("Substabelecimento", {VEDADO:"vedado",COM:"permitido com reserva",SEM:"permitido sem reserva"}[a.substab]||"", st(a.substab));
  R("Prazo de validade", a.prazo==="INDETERMINADO"?"indeterminado":(a.prazo==="DEFINIDO"?a.prazoTexto:""), a.prazo==="DEFINIDO"?st(a.prazoTexto):st(a.prazo));
  R("CNIB — resultado", a.cnib.resultado, st(a.cnib.resultado));
  R("CNIB — código hash", a.cnib.hash, st(a.cnib.hash));
  if(a.cnib.resultado==="POSITIVO") at("CNIB com resultado POSITIVO: há indisponibilidade de bens. A procuração pode ser lavrada, mas os bens indisponíveis não poderão ser alienados ou onerados; consigne a ciência do outorgante.");
  const pres=[]; a.outorgantes.forEach(o=>{ if(o.tp==="PF") pres.push(o.pf); else o.pj.reps.forEach(r=>pres.push(r)); });
  if(pres.some(p=>p.assin && p.assin!=="normal")){
    R("Assinante a rogo", a.rogo.nome, st(a.rogo.nome)); R("Testemunha 1", a.rogo.t1, st(a.rogo.t1)); R("Testemunha 2", a.rogo.t2, st(a.rogo.t2));
  }
  const tot = EMOL.reduce((s,[k])=>s+(parseFloat(String(a.emol[k]||"").replace(/\./g,"").replace(",","."))||0),0);
  const informado = parseFloat(String(a.emol.total||"").replace(/\./g,"").replace(",","."));
  const todos = EMOL.every(([k])=>!vazio(a.emol[k]));
  const difere = todos && !isNaN(informado) && Math.abs(tot-informado)>0.009;
  R("Emolumentos", todos?"informados":"", todos ? (difere?"ATENÇÃO":"OK") : "PENDENTE", difere?"a soma das rubricas é R$ "+tot.toFixed(2).replace(".",","):"");
  if(difere) at("Emolumentos: a soma das rubricas (R$ "+tot.toFixed(2).replace(".",",")+") não confere com o total informado (R$ "+a.emol.total+").");
  R("Selo digital", a.selo, vazio(a.selo)?"PENDENTE":"OK", vazio(a.selo)?"aposto na lavratura":"");
  return {rows, alertas};
}

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const RPR = (b, hl, extra) => '<w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma" w:cs="Tahoma" w:eastAsia="Tahoma"/>'+(b?'<w:b/><w:bCs/>':'')+(extra||'')+'<w:color w:val="000000"/><w:sz w:val="24"/><w:szCs w:val="24"/>'+(hl?'<w:highlight w:val="yellow"/>':'')+'<w:lang w:val="pt-BR"/></w:rPr>';
const PPR = jc => '<w:pPr><w:widowControl/><w:suppressAutoHyphens/><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:ind w:left="57" w:right="0" w:hanging="0"/><w:jc w:val="'+jc+'"/></w:pPr>';
const run = (t,b,hl,extra) => '<w:r>'+RPR(b,hl,extra)+'<w:t xml:space="preserve">'+esc(t)+'</w:t></w:r>';
const par = (jc, runs) => '<w:p>'+PPR(jc)+(runs||'')+'</w:p>';
function documentXml(m){
  // une segmentos vizinhos de mesmo estilo
  const juntos=[]; m.seg.forEach(s=>{ const u=juntos[juntos.length-1]; if(u && u.b===s.b && !!u.p===!!s.p) u.t+=s.t; else juntos.push({t:s.t,b:s.b,p:s.p}); });
  let body = par("center", run(m.titulo,true,false,'<w:u w:val="single"/>'));
  body += par("both", "");
  body += par("both", juntos.map(s=>run(s.t,s.b,s.p)).join(""));
  m.ass.forEach(x=>{
    body += par("center","") + par("center","") + par("center", run("______________________________________________"));
    body += par("center", run(x.nome,true,/PENDENTE/.test(x.nome)));
    if(x.sub) body += par("center", run(x.sub));
  });
  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2268" w:right="850" w:bottom="567" w:left="1134" w:header="1984" w:footer="0" w:gutter="0"/><w:cols w:space="720"/><w:docGrid w:linePitch="360"/></w:sectPr>';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>'+body+sect+'</w:body></w:document>';
}
const DOCX_FIXOS = {
  "[Content_Types].xml":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>',
  "_rels/.rels":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>',
  "word/_rels/document.xml.rels":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/></Relationships>',
  "word/styles.xml":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Tahoma" w:hAnsi="Tahoma" w:cs="Tahoma" w:eastAsia="Tahoma"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="pt-BR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>',
  "word/settings.xml":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:defaultTabStop w:val="709"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat></w:settings>',
  "docProps/core.xml":'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>Procuração Pública</dc:title><dc:language>pt-BR</dc:language></cp:coreProperties>'
};
function textoPlano(m){ return m.titulo+"\n\n"+m.seg.map(s=>s.t).join("")+"\n\n"+m.ass.map(x=>"______________________________________________\n"+x.nome+(x.sub?"\n"+x.sub:"")).join("\n\n"); }

return {MODELOS, PODERES, REGIMES, CARGOS_ESC, EMOL, novoAto, novaParte, novaPF, montar, conferir, documentXml, DOCX_FIXOS, textoPlano,
  cpfOk, cnpjOk, fmtCPF, fmtCNPJ, fmtCEP, dataBR, dataExtensoSeg, extenso, vazio};
})();
if(typeof module!=="undefined") module.exports=N;
</script>

<script>
/* ===== Interface ===== */
(function(){
const $ = s => document.querySelector(s);
const H = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const LS_KEY = "livro-procuracoes";
let db = null, downloads = null, modoLocal = false;
let arquivo = {};          // id -> registro
let atual = null;          // id aberto
let etapa = "ato";
let filtro = "todas", termo = "";
let escreventes = [];
let fichaAberta = false;

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function hojeISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function uid(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function lsLer(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function lsGravar(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(arquivo)); }catch(e){} }

/* ---- persistência ---- */
let fila = Promise.resolve(), timer = null, sujo = new Set();
function salvarDepois(id){ if(arquivo[id]) arquivo[id].atualizadoEm=new Date().toISOString(); sujo.add(id); clearTimeout(timer); timer=setTimeout(descarregar, 700); estado("Salvando…"); }
function descarregar(){
  const ids=[...sujo]; sujo.clear();
  ids.forEach(id=>{ const reg=arquivo[id]; if(!reg) return;
    if(db) fila = fila.then(()=>db.collection("procuracoes").doc(id).set(JSON.parse(JSON.stringify(reg)))).then(()=>estado("Arquivado na biblioteca às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}))).catch(e=>estado("Não foi possível salvar: "+(e&&e.message||"erro")+". Suas alterações continuam na tela."));
  });
  if(!db){ lsGravar(); estado("Salvo neste navegador às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})); }
  renderLista();
}
function excluir(id){
  delete arquivo[id];
  if(db) fila = fila.then(()=>db.collection("procuracoes").doc(id).delete()).catch(()=>{});
  else lsGravar();
  if(atual===id){ atual=null; }
  renderLista(); renderMesa(); toast("Procuração excluída");
}
function estado(t){ $("#estado").textContent = t; }

async function iniciar(){
  renderLista(); renderMesa();
  const cl = window.claude;
  if(cl && cl.use){
    try{ db = await cl.use("db"); }catch(e){ db=null; }
    try{ downloads = await cl.use("downloads"); }catch(e){ downloads=null; }
  }
  if(db){
    db.collection("procuracoes").onSnapshot(snap=>{
      const novo={}; snap.docs.forEach(d=>{ const x=d.data(); if(x) novo[d.id]=x; });
      // preserva o que está sendo editado e ainda não foi gravado
      // mantém a cópia local quando ela é mais nova que a do servidor (eco atrasado de gravação anterior)
      sujo.forEach(id=>{ if(arquivo[id]) novo[id]=arquivo[id]; });
      Object.keys(novo).forEach(id=>{ const loc=arquivo[id]; if(loc && String(loc.atualizadoEm||"")>String(novo[id].atualizadoEm||"")) novo[id]=loc; });
      const mudouAtual = atual && arquivo[atual] && novo[atual] && novo[atual]!==arquivo[atual];
      arquivo=novo; renderLista();
      if(atual && !arquivo[atual]){ atual=null; renderMesa(); }
      else if(mudouAtual && !(document.activeElement && document.activeElement.closest && document.activeElement.closest(".mesa"))) redesenha();
      estado("Biblioteca compartilhada · "+Object.keys(arquivo).length+" procuração(ões)");
    }, err=>estado("Biblioteca indisponível: "+err.message));
    db.doc("config/cartorio").onSnapshot(s=>{ const d=s.data(); escreventes=(d&&d.escreventes)||[]; if(etapa==="ato" && atual) renderMesa(); }, ()=>{});
  } else {
    modoLocal = true; arquivo = lsLer();
    try{ escreventes = JSON.parse(localStorage.getItem(LS_KEY+"-esc")||"[]"); }catch(e){ escreventes=[]; }
    estado("Modo local: as procurações ficam salvas apenas neste navegador.");
    renderLista(); renderMesa();
  }
}
function salvarEscreventes(){
  if(db) db.doc("config/cartorio").set({escreventes}).catch(()=>toast("Não foi possível salvar o cadastro"));
  else try{ localStorage.setItem(LS_KEY+"-esc", JSON.stringify(escreventes)); }catch(e){}
}

/* ---- biblioteca ---- */
const STATUS = {rascunho:["Rascunho","pend"], conferida:["Conferida","inf"], lavrada:["Lavrada","ok"]};
function nomeParte(o){ return o ? (o.tp==="PJ" ? o.pj.razao : o.pf.nome) : ""; }
function tituloReg(r){ const n=nomeParte(r.outorgantes[0]); return (n||"Sem outorgante").trim(); }
function renderFiltros(){
  const tipos=["todas"].concat([...new Set(Object.values(arquivo).map(r=>r.tipo))].sort());
  $("#filtros").innerHTML = tipos.map(t=>'<button type="button" class="chip'+(filtro===t?" on":"")+'" data-f="'+H(t)+'">'+H(t==="todas"?"Todas":t)+'</button>').join("");
}
function renderLista(){
  renderFiltros();
  const q = termo.toLowerCase().replace(/[.\-\/]/g,"");
  const regs = Object.entries(arquivo).filter(([id,r])=>{
    if(filtro!=="todas" && r.tipo!==filtro) return false;
    if(!q) return true;
    const alvo = [r.tipo].concat(r.outorgantes.concat(r.outorgados).map(o=>o.tp==="PJ"?o.pj.razao+" "+o.pj.cnpj+" "+o.pj.reps.map(x=>x.nome+" "+x.cpf).join(" "):o.pf.nome+" "+o.pf.cpf)).join(" ").toLowerCase().replace(/[.\-\/]/g,"");
    return alvo.includes(q);
  }).sort((a,b)=>String(b[1].atualizadoEm||"").localeCompare(String(a[1].atualizadoEm||"")));
  if(!regs.length){
    $("#lista").innerHTML = '<div class="vazio">'+(Object.keys(arquivo).length ? "Nenhuma procuração encontrada para esta busca." : "Nenhuma procuração arquivada ainda. Escolha um modelo ao lado para lavrar a primeira; ela fica guardada aqui automaticamente.")+'</div>';
    return;
  }
  $("#lista").innerHTML = regs.map(([id,r])=>{
    const m = N.montar(r); const s=STATUS[r.status]||STATUS.rascunho;
    const od = nomeParte(r.outorgados[0]);
    return '<button type="button" class="item'+(id===atual?" on":"")+'" data-id="'+id+'"><b>'+H(tituloReg(r))+'</b>'+
      '<span class="meta">'+H(r.tipo)+(od?' → '+H(od):'')+'</span>'+
      '<span class="meta"><span class="pill '+s[1]+'">'+s[0]+'</span>'+(m.pend.length?'<span class="pill pend">'+m.pend.length+' pendência'+(m.pend.length>1?'s':'')+'</span>':'<span class="pill ok">completa</span>')+
      (r.ato.data?'<span>'+N.dataBR(r.ato.data)+'</span>':'')+'</span></button>';
  }).join("");
}
$("#filtros").addEventListener("click",e=>{ const b=e.target.closest("[data-f]"); if(!b) return; filtro=b.dataset.f; renderLista(); });
$("#busca").addEventListener("input",e=>{ termo=e.target.value.trim(); renderLista(); });
$("#lista").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(!b) return; atual=b.dataset.id; etapa="ato"; fichaAberta=false; renderLista(); renderMesa(); });
$("#bt-nova").addEventListener("click",()=>{ atual=null; renderLista(); renderMesa(); });

function criar(modeloId){
  const id=uid(); const r=N.novoAto(modeloId);
  r.ato.data=hojeISO(); r.criadoEm=new Date().toISOString();
  if(escreventes.length===1){ r.ato.escNome=escreventes[0].nome; r.ato.escCargo=escreventes[0].cargo; }
  arquivo[id]=r; atual=id; etapa="ato"; salvarDepois(id); renderMesa();
}

/* ---- campos ---- */
function get(obj, path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k], obj); }
function set(obj, path, val){ const ks=path.split("."); const last=ks.pop(); const alvo=ks.reduce((o,k)=>o[k],obj); alvo[last]=val; }
function fid(path){ return "f-"+path.replace(/\./g,"-"); }
function campo(path, label, o){
  o=o||{}; const r=arquivo[atual]; const v=get(r,path); const val=v==null?"":v;
  const cls=["f"]; if(o.dado) cls.push("dado"); if(o.larga) cls.push("larga");
  if(o.req && N.vazio(val)) cls.push("falta"); if(o.erro) cls.push("erro");
  let ctl;
  if(o.opts) ctl='<select id="'+fid(path)+'" data-p="'+path+'"'+(o.re?' data-re="1"':'')+'><option value="">— selecione —</option>'+o.opts.map(x=>{ const [k,l]=Array.isArray(x)?x:[x,x]; return '<option value="'+H(k)+'"'+(String(val)===String(k)?" selected":"")+'>'+H(l)+'</option>'; }).join("")+'</select>';
  else if(o.ta) ctl='<textarea id="'+fid(path)+'" data-p="'+path+'" placeholder="'+H(o.ph||"")+'">'+H(val)+'</textarea>';
  else ctl='<input id="'+fid(path)+'" data-p="'+path+'" type="'+(o.tipo||"text")+'" value="'+H(val)+'" placeholder="'+H(o.ph||"")+'"'+(o.mask?' data-mask="'+o.mask+'"':'')+(o.list?' list="'+o.list+'"':'')+' autocomplete="off">';
  return '<label class="'+cls.join(" ")+'">'+H(label)+ctl+(o.dica?'<span class="dica">'+H(o.dica)+'</span>':'')+'</label>';
}
function seg(path, opcoes){
  const r=arquivo[atual]; const v=get(r,path);
  return '<span class="seg" role="group">'+opcoes.map(([k,l])=>'<button type="button" data-seg="'+path+'" data-v="'+k+'" class="'+(v===k?"on":"")+'">'+H(l)+'</button>').join("")+'</span>';
}

function formPF(base, p, modo){
  // modo: "outorgante" | "outorgado" | "rep"
  const cpfErr = !N.vazio(p.cpf) && !N.cpfOk(p.cpf);
  const venc = p.docValidade && arquivo[atual].ato.data && p.docValidade < arquivo[atual].ato.data;
  let h='<div class="grade">';
  h+=campo(base+".nome","Nome completo",{req:1,larga:1});
  if(modo==="rep") h+=campo(base+".cargo","Cargo na empresa",{req:1,ph:"sócio administrador"});
  h+=campo(base+".sexo","Sexo (para concordância)",{opts:[["F","Feminino"],["M","Masculino"]],req:1,re:1});
  h+=campo(base+".nac","Nacionalidade",{req:1,ph:"brasileira"});
  h+=campo(base+".prof","Profissão",{req:1});
  h+=campo(base+".cpf","CPF",{req:1,dado:1,mask:"cpf",erro:cpfErr,dica:cpfErr?"Dígito verificador inválido":"",ph:"000.000.000-00"});
  h+=campo(base+".docTipo","Documento de identidade",{opts:[["CNH","CNH"],["RG","RG"],["RNM","RNM (estrangeiro)"],["PASS","Passaporte"],["OAB","Carteira da OAB"],["OUTRO","Outro"]],req:1,re:1});
  if(p.docTipo==="OUTRO") h+=campo(base+".docOutro","Tipo do documento",{req:1,ph:"Carteira do CRM"});
  if(p.docTipo) h+=campo(base+".docNum",p.docTipo==="CNH"?"Nº de registro da CNH":"Número",{req:1,dado:1});
  if(["RG","RNM","PASS","OUTRO"].includes(p.docTipo)) h+=campo(base+".docOrg","Órgão emissor",{req:1,ph:p.docTipo==="RG"?"SSP":""});
  if(["CNH","RG","OAB"].includes(p.docTipo)) h+=campo(base+".docUF",p.docTipo==="CNH"?"DETRAN (UF)":(p.docTipo==="OAB"?"Seção (UF)":"UF"),{req:1,ph:"SP"});
  if(p.docTipo==="CNH") h+=campo(base+".cnhRg","RG que consta na CNH",{req:1,dado:1,ph:"0000000-SSP/SP"});
  if(p.docTipo) h+=campo(base+".docValidade","Validade do documento",{tipo:"date",erro:venc,dica:venc?"Vencido na data do ato":""});
  if(modo!=="outorgado") h+=campo(base+".nasc","Data de nascimento",{tipo:"date",dica:"Usada só para conferência (idoso/menor)"});
  h+=campo(base+".ec","Estado civil",{opts:[["solteiro","Solteiro(a)"],["casado","Casado(a)"],["divorciado","Divorciado(a)"],["separado","Separado(a) judicialmente"],["viuvo","Viúvo(a)"]],req:1,re:1});
  h+='</div>';
  if(modo!=="outorgado" && p.ec){
    h+='<div class="sub"><div class="grade">';
    if(p.ec==="casado"){
      h+=campo(base+".conjNome","Nome do cônjuge",{req:1});
      h+=campo(base+".regime","Regime de bens",{opts:N.REGIMES,req:1,re:1});
      h+=campo(base+".casData","Data do casamento",{tipo:"date",req:1});
      h+=campo(base+".certMat","Matrícula da certidão de casamento",{req:1,dado:1});
      h+=campo(base+".pacto","Pacto antenupcial (se houver)",{ph:"lavrada no … Tabelião, livro …, fls. …, registrada sob nº …",larga:1});
    } else {
      if(p.ec==="solteiro") h+=campo(base+".certTipo","Certidão de nascimento",{opts:[["inteiro teor","Inteiro teor"],["breve relato","Breve relato"]]});
      h+=campo(base+".certData","Certidão emitida em",{tipo:"date",req:1});
      h+=campo(base+".certMat","Matrícula da certidão",{req:1,dado:1,larga:1});
      h+=campo(base+".ue","União estável",{opts:[["nao","Declara não conviver"],["sim","Convive em união estável"]],req:1,re:1});
      if(p.ue==="sim") h+=campo(base+".ueNome","Nome do(a) companheiro(a)",{req:1});
    }
    h+=campo(base+".nomeCert","Nome como consta na certidão (se diferente)",{dica:"Preencha só para conferir divergência de nome",larga:1});
    h+='</div></div>';
  }
  h+='<div class="grade">';
  h+=campo(base+".end","Endereço completo",{req:1,larga:1,ph:"Rua …, nº … – Bairro – Cidade-UF"});
  h+=campo(base+".cep","CEP",{req:1,dado:1,mask:"cep",ph:"00000-000"});
  h+=campo(base+".email","E-mail (opcional)",{tipo:"email"});
  h+=campo(base+".tel","Telefone (opcional)",{tipo:"tel"});
  if(modo!=="outorgado") h+=campo(base+".assin","Assinatura",{opts:[["normal","Assina normalmente"],["nao_alfabetizado","Não alfabetizado(a) — a rogo"],["dificuldade","Dificuldade para assinar — a rogo"]],re:1});
  h+='</div>';
  return h;
}
function formPJ(base, pj){
  const err = !N.vazio(pj.cnpj) && !N.cnpjOk(pj.cnpj);
  let h='<div class="grade">';
  h+=campo(base+".razao","Razão social",{req:1,larga:1});
  h+=campo(base+".cnpj","CNPJ",{req:1,dado:1,mask:"cnpj",erro:err,dica:err?"Dígito verificador inválido":"",ph:"00.000.000/0000-00"});
  h+=campo(base+".nire","NIRE ou registro no RCPJ",{dado:1});
  h+=campo(base+".sede","Endereço da sede",{req:1,larga:1});
  h+=campo(base+".cep","CEP da sede",{req:1,dado:1,mask:"cep"});
  h+=campo(base+".atoConst","Ato constitutivo (nº e data do registro na JUCESP)",{req:1,larga:1,ph:"registrado na JUCESP sob nº …, em …"});
  h+=campo(base+".ultAlt","Última alteração consolidada (nº e data)",{req:1,larga:1,ph:"registrada sob nº …, em …"});
  h+=campo(base+".certSimpl","Certidão simplificada emitida em",{tipo:"date",req:1});
  h+=campo(base+".clausula","Cláusula que dá poderes para outorgar procuração",{req:1,ph:"Sétima"});
  h+=campo(base+".adm","Administração",{opts:[["isolada","Isolada"],["conjunta","Conjunta"]],re:1});
  h+='</div>';
  pj.reps.forEach((r,i)=>{
    h+='<div class="sub"><div class="bloco-topo"><h3>Representante legal '+(pj.reps.length>1?i+1:"")+'</h3>'+(pj.reps.length>1?'<button type="button" class="mini" data-acao="rmRep" data-base="'+base+'" data-i="'+i+'">Remover</button>':'')+'</div>'+formPF(base+".reps."+i, r, "rep")+'</div>';
  });
  h+='<div><button type="button" class="mini" data-acao="addRep" data-base="'+base+'">+ Representante</button></div>';
  return h;
}
function formPartes(lista, chave, rotulo){
  const r=arquivo[atual];
  let h='';
  r[chave].forEach((o,i)=>{
    const base=chave+"."+i;
    h+='<section class="bloco"><div class="bloco-topo"><h3>'+rotulo+(r[chave].length>1?" "+(i+1):"")+'</h3><span style="display:flex;gap:8px;flex-wrap:wrap">'+
      seg(base+".tp",[["PF","Pessoa física"],["PJ","Pessoa jurídica (CNPJ)"]])+
      (r[chave].length>1?'<button type="button" class="mini" data-acao="rmParte" data-chave="'+chave+'" data-i="'+i+'">Remover</button>':'')+'</span></div>';
    h+= o.tp==="PJ" ? formPJ(base+".pj", o.pj) : formPF(base+".pf", o.pf, chave==="outorgantes"?"outorgante":"outorgado");
    h+='</section>';
  });
  h+='<div><button type="button" class="btn" data-acao="addParte" data-chave="'+chave+'">+ Adicionar '+rotulo.toLowerCase()+'</button></div>';
  if(chave==="outorgados" && r.outorgados.length>1) h+='<section class="bloco"><h3>Como os procuradores atuam</h3>'+seg("atuacao",[["isoladamente","Em conjunto ou isoladamente"],["conjunto","Sempre em conjunto"]])+'</section>';
  return h;
}

/* ---- etapas ---- */
const ETAPAS=[["ato","Ato"],["outorgantes","Outorgantes"],["outorgados","Outorgados"],["poderes","Poderes"],["fecho","Encerramento"],["conferencia","Conferência e minuta"]];
function renderMesa(){
  const mesa=$("#mesa");
  if(!atual || !arquivo[atual]){
    mesa.innerHTML='<div class="topo"><div><h3>Nova procuração</h3><h2>Escolha um modelo</h2></div></div>'+
      '<p class="aviso">Cada modelo já traz os poderes e o tipo de parte (pessoa física ou CNPJ). Você só preenche os dados; a minuta segue o modelo oficial do cartório e tudo fica arquivado na biblioteca.</p>'+
      '<div class="modelos">'+N.MODELOS.map(m=>'<button type="button" class="modelo" data-modelo="'+m.id+'"><b>'+H(m.nome)+'</b><span>'+H(m.sub)+'</span><span class="tags">'+
        '<span class="pill '+(m.ot==="PJ"?"inf":"ok")+'">'+(m.ot==="PJ"?"CNPJ":"CPF")+'</span>'+(m.poderes.length?'<span class="pill pend">'+m.poderes.length+' poder'+(m.poderes.length>1?'es':'')+'</span>':'')+'</span></button>').join("")+'</div>';
    return;
  }
  const r=arquivo[atual]; const s=STATUS[r.status]||STATUS.rascunho;
  let h='<div class="topo"><div><h3>'+H(r.tipo)+' · <span class="pill '+s[1]+'">'+s[0]+'</span></h3><h2>'+H(tituloReg(r))+'</h2></div><div class="acoes">'+
    '<button type="button" class="btn" data-acao="duplicar">Duplicar</button>'+
    '<button type="button" class="btn perigo" data-acao="excluir">Excluir</button></div></div>';
  h+='<nav class="etapas" aria-label="Etapas">'+ETAPAS.map(([k,l],i)=>'<button type="button" data-etapa="'+k+'" class="'+(etapa===k?"on":"")+'"><span class="n">'+(i+1)+'</span>'+l+'</button>').join("")+'</nav>';
  h+='<div class="painel">'+painel(r)+'</div>';
  mesa.innerHTML=h;
}
function painel(r){
  if(etapa==="ato"){
    let h='<section class="bloco"><h3>Dados do ato</h3><div class="grade">';
    h+=campo("ato.data","Data do ato",{tipo:"date",req:1,dica:r.ato.data?extensoTxt(r.ato.data):""});
    h+=campo("status","Situação",{opts:[["rascunho","Rascunho"],["conferida","Conferida"],["lavrada","Lavrada"]]});
    h+='</div></section>';
    const mAtual=N.MODELOS.find(x=>x.id===r.modelo);
    h+='<section class="bloco"><div class="bloco-topo"><h3>Tipo de procuração</h3><span class="aviso">Atual: <b>'+H(mAtual?mAtual.nome+" · "+mAtual.sub:r.tipo)+'</b></span></div>'+
      '<div class="biblio">'+N.MODELOS.map(m=>'<button type="button" class="chip'+(m.id===r.modelo?" on":"")+'" data-acao="trocarModelo" data-m="'+m.id+'">'+H(m.nome)+' · '+H(m.sub)+'</button>').join("")+'</div>'+
      '<span class="aviso">Trocar o tipo substitui os poderes e o tipo de parte (pessoa física ou CNPJ) pelos do novo modelo. Os dados já digitados das pessoas e empresas são mantidos.</span></section>';
    h+='<section class="bloco"><div class="bloco-topo"><h3>Escrevente que lavra</h3></div>';
    if(escreventes.length) h+='<div class="biblio">'+escreventes.map((e,i)=>'<button type="button" class="chip'+(r.ato.escNome===e.nome?" on":"")+'" data-acao="usarEsc" data-i="'+i+'">'+H(e.nome)+' · '+H(e.cargo)+'</button>').join("")+'</div>';
    h+='<div class="grade">'+campo("ato.escNome","Nome completo",{req:1})+campo("ato.escCargo","Cargo",{req:1,list:"cargos",dica:"Entra como \"perante mim, [cargo] da Tabeliã…\""})+'</div>';
    h+='<datalist id="cargos">'+N.CARGOS_ESC.map(c=>'<option value="'+H(c)+'">').join("")+'</datalist>';
    h+='<div><button type="button" class="mini" data-acao="salvarEsc">Guardar no cadastro de escreventes</button></div></section>';
    return h;
  }
  if(etapa==="outorgantes") return formPartes(r.outorgantes,"outorgantes","Outorgante");
  if(etapa==="outorgados") return formPartes(r.outorgados,"outorgados","Outorgado");
  if(etapa==="poderes"){
    let h='<section class="bloco"><h3>Forma da outorga</h3>'+seg("intro",[["amplos","Amplos e gerais"],["amplos_especiais","Amplos, gerais e especiais"],["especiais","Especiais"]])+'</section>';
    h+='<section class="bloco"><div class="bloco-topo"><h3>Poderes na ordem da minuta</h3></div>';
    if(!r.poderes.length) h+='<div class="vazio">Nenhum poder incluído. Adicione da biblioteca de cláusulas abaixo.</div>';
    r.poderes.forEach((pd,i)=>{
      const def=N.PODERES[pd.k];
      h+='<div class="poder"><div class="poder-topo"><span class="num">'+(i+1)+')</span><input id="'+fid("poderes."+i+".titulo")+'" data-p="poderes.'+i+'.titulo" value="'+H(pd.titulo)+'" placeholder="TÍTULO (opcional)" aria-label="Título do poder">'+
        '<button type="button" class="mini" data-acao="sobe" data-i="'+i+'" aria-label="Subir">↑</button><button type="button" class="mini" data-acao="desce" data-i="'+i+'" aria-label="Descer">↓</button><button type="button" class="mini" data-acao="rmPoder" data-i="'+i+'">Remover</button></div>'+
        '<span class="aviso">'+H(def.nome)+'</span>';
      if(def.vars.length) h+='<div class="grade">'+def.vars.map(x=>campo("poderes."+i+".v."+x.n,x.l,{req:x.req,ta:x.ta,ph:x.ph,larga:x.ta})).join("")+'</div>';
      h+='</div>';
    });
    h+='</section><section class="bloco"><h3>Biblioteca de cláusulas</h3><div class="biblio">'+Object.entries(N.PODERES).map(([k,d])=>'<button type="button" class="chip" data-acao="addPoder" data-k="'+k+'">+ '+H(d.nome)+'</button>').join("")+'</div></section>';
    h+='<section class="bloco"><h3>Cláusulas de efeito especial</h3><div class="biblio">'+
      [["causaPropria","Em causa própria (art. 685 CC)"],["irrevogavel","Irrevogável (arts. 683–684 CC)"],["citacao","Poder para receber citação"]].map(([k,l])=>'<button type="button" class="chip'+(r.flags[k]?" on":"")+'" data-acao="flag" data-k="'+k+'">'+(r.flags[k]?"✓ ":"")+H(l)+'</button>').join("")+'</div><span class="aviso">Cada uma gera um alerta jurídico na conferência.</span></section>';
    return h;
  }
  if(etapa==="fecho"){
    let h='<section class="bloco"><h3>Substabelecimento</h3>'+seg("substab",[["VEDADO","Vedado"],["COM","Permitido com reserva"],["SEM","Permitido sem reserva"]])+'</section>';
    h+='<section class="bloco"><h3>Prazo de validade</h3>'+seg("prazo",[["INDETERMINADO","Indeterminado"],["DEFINIDO","Definido"]])+(r.prazo==="DEFINIDO"?'<div class="grade">'+campo("prazoTexto","Prazo",{req:1,ph:"1 (um) ano a contar desta data"})+'</div>':'')+'</section>';
    h+='<section class="bloco"><h3>Central de indisponibilidade (CNIB)</h3><div class="grade">'+campo("cnib.resultado","Resultado",{opts:["NEGATIVO","POSITIVO"],req:1})+campo("cnib.hash","Código hash",{req:1,dado:1})+'</div></section>';
    h+='<section class="bloco"><h3>Emolumentos e selo</h3><span class="aviso">Informe os valores da tabela vigente. Campos vazios saem como R$ [PENDENTE].</span><div class="grade">'+
      N.EMOL.map(([k,l])=>campo("emol."+k,l+" (R$)",{dado:1,ph:"0,00"})).join("")+campo("emol.total","Total (R$)",{dado:1,ph:"0,00"})+campo("selo","Selo digital",{dado:1,larga:1,dica:"Pode ficar em branco até a lavratura"})+'</div></section>';
    const pres=[]; r.outorgantes.forEach(o=>{ if(o.tp==="PF") pres.push(o.pf); else o.pj.reps.forEach(x=>pres.push(x)); });
    if(pres.some(p=>p.assin && p.assin!=="normal")) h+='<section class="bloco"><h3>Assinatura a rogo</h3><div class="grade">'+campo("rogo.nome","Quem assina a rogo",{req:1})+campo("rogo.qualif","Qualificação (nacionalidade, documento, CPF)",{req:1,larga:1})+campo("rogo.t1","Testemunha 1 (nome e documento)",{req:1,larga:1})+campo("rogo.t2","Testemunha 2 (nome e documento)",{req:1,larga:1})+'</div></section>';
    return h;
  }
  // conferência
  const cf=N.conferir(r), m=N.montar(r);
  const cnt={OK:0,PENDENTE:0,"ATENÇÃO":0}; cf.rows.forEach(x=>{ if(x.status) cnt[x.status]++; });
  let h='<section class="bloco"><div class="bloco-topo"><h3>Ficha de conferência</h3><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ok">'+cnt.OK+' OK</span><span class="pill pend">'+cnt.PENDENTE+' pendente</span><span class="pill at">'+cnt["ATENÇÃO"]+' atenção</span></span></div>';
  h+='<div class="tabela"><table><thead><tr><th>Campo</th><th>Valor</th><th>Status</th></tr></thead><tbody>'+cf.rows.map(x=>x.sec?'<tr class="sec"><td colspan="3">'+H(x.sec)+'</td></tr>':
    '<tr><td>'+H(x.campo)+'</td><td class="v">'+H(x.valor)+'</td><td><span class="pill '+({OK:"ok",PENDENTE:"pend","ATENÇÃO":"at"}[x.status])+'">'+H(x.status)+'</span>'+(x.nota?'<div class="aviso">'+H(x.nota)+'</div>':'')+'</td></tr>').join("")+'</tbody></table></div>';
  h+='<div class="confirmar">'+(r.fichaOk?'<span>Ficha confirmada. A minuta abaixo reflete os dados atuais.</span><button type="button" class="mini" data-acao="desconfirmar">Reabrir conferência</button>':
    '<span>Confira a ficha com os documentos originais antes de gerar a minuta.</span><button type="button" class="btn p" data-acao="confirmar">Confirmar ficha e gerar minuta</button>')+'</div></section>';
  if(cf.alertas.length) h+='<section class="bloco"><h3>Alertas jurídicos</h3><ul class="alertas">'+cf.alertas.map(a=>'<li>'+H(a)+'</li>').join("")+'</ul></section>';
  if(r.fichaOk){
    h+='<section class="bloco"><div class="bloco-topo"><h3>Minuta</h3><span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn p" data-acao="docx">Baixar .docx</button><button type="button" class="btn" data-acao="copiar">Copiar texto</button></span></div>';
    h+='<div class="folha"><div class="tit">'+H(m.titulo)+'</div><div class="corpo">'+m.seg.map(s=>{ let t=H(s.t); if(s.b) t='<b>'+t+'</b>'; if(s.p) t='<mark>'+t+'</mark>'; return t; }).join("")+'</div>'+
      m.ass.map(x=>'<div class="ass">______________________________________________<br><b>'+H(x.nome)+'</b>'+(x.sub?'<br>'+H(x.sub):'')+'</div>').join("")+'</div>';
    if(m.pend.length) h+='<h3>Pendências ('+m.pend.length+')</h3><ul class="alertas">'+m.pend.map(p=>'<li class="pend">'+H(p)+'</li>').join("")+'</ul>';
    h+='</section>';
  }
  return h;
}
function extensoTxt(iso){ const s=N.dataExtensoSeg(iso); return s? s.map(x=>x[0]).join("") : ""; }

/* ---- eventos da mesa ---- */
const mesa=$("#mesa");
mesa.addEventListener("input",e=>{
  const el=e.target; const p=el.dataset.p; if(!p||!atual) return;
  let v=el.value;
  if(el.dataset.mask==="cpf"){ v=N.fmtCPF(v); el.value=v; }
  if(el.dataset.mask==="cnpj"){ v=N.fmtCNPJ(v); el.value=v; }
  if(el.dataset.mask==="cep"){ v=N.fmtCEP(v); el.value=v; }
  set(arquivo[atual], p, v);
  if(el.tagName!=="SELECT") { const lab=el.closest("label.f"); if(lab) lab.classList.toggle("falta", lab.classList.contains("falta") && !v); }
  salvarDepois(atual);
});
mesa.addEventListener("change",e=>{
  const el=e.target; if(!el.dataset.p||!atual) return;
  // estrutura muda (selects) ou campos validados: redesenha preservando foco/rolagem
  if(el.tagName==="SELECT" || el.dataset.mask || el.type==="date"){ setTimeout(()=>{ redesenha(); renderLista(); },0); }
});
mesa.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.modelo){ criar(b.dataset.modelo); return; }
  if(b.dataset.etapa){ etapa=b.dataset.etapa; renderMesa(); window.scrollTo(0,0); return; }
  const r=arquivo[atual]; if(!r) return;
  if(b.dataset.seg){ set(r,b.dataset.seg,b.dataset.v); salvarDepois(atual); redesenha(); return; }
  const ac=b.dataset.acao; if(!ac) return;
  const i=+b.dataset.i;
  if(ac==="addParte"){ r[b.dataset.chave].push(N.novaParte("PF")); }
  else if(ac==="rmParte"){ r[b.dataset.chave].splice(i,1); }
  else if(ac==="addRep"){ get(r,b.dataset.base).reps.push(N.novaPF({cargo:"sócio administrador"})); }
  else if(ac==="rmRep"){ get(r,b.dataset.base).reps.splice(i,1); }
  else if(ac==="addPoder"){ r.poderes.push({k:b.dataset.k, titulo:N.PODERES[b.dataset.k].titulo, v:{}}); toast("Poder incluído na posição "+r.poderes.length); }
  else if(ac==="rmPoder"){ r.poderes.splice(i,1); }
  else if(ac==="sobe" && i>0){ const t=r.poderes[i]; r.poderes[i]=r.poderes[i-1]; r.poderes[i-1]=t; }
  else if(ac==="desce" && i<r.poderes.length-1){ const t=r.poderes[i]; r.poderes[i]=r.poderes[i+1]; r.poderes[i+1]=t; }
  else if(ac==="trocarModelo"){
    const m=N.MODELOS.find(x=>x.id===b.dataset.m); if(!m || m.id===r.modelo) return;
    const antigos={}; r.poderes.forEach(pd=>{ if(!antigos[pd.k]) antigos[pd.k]=pd; });
    r.modelo=m.id; r.tipo=m.tipo; r.intro=m.intro;
    r.poderes=m.poderes.map(k=>antigos[k]||{k, titulo:N.PODERES[k].titulo, v:{}});
    if(r.outorgantes[0]) r.outorgantes[0].tp=m.ot;
    if(r.outorgados[0]){ r.outorgados[0].tp=m.od; if(m.odDoc && !r.outorgados[0].pf.docTipo) r.outorgados[0].pf.docTipo=m.odDoc; }
    r.fichaOk=false; if(r.status==="conferida") r.status="rascunho";
    toast("Tipo alterado para "+m.nome+" · "+m.sub);
  }
  else if(ac==="flag"){ r.flags[b.dataset.k]=!r.flags[b.dataset.k]; }
  else if(ac==="usarEsc"){ const x=escreventes[i]; r.ato.escNome=x.nome; r.ato.escCargo=x.cargo; }
  else if(ac==="salvarEsc"){ if(N.vazio(r.ato.escNome)||N.vazio(r.ato.escCargo)){ toast("Preencha nome e cargo do escrevente"); return; }
    escreventes=escreventes.filter(x=>x.nome!==r.ato.escNome).concat([{nome:r.ato.escNome.trim(),cargo:r.ato.escCargo.trim()}]); salvarEscreventes(); toast("Escrevente guardado no cadastro"); }
  else if(ac==="confirmar"){ r.fichaOk=true; if(r.status==="rascunho") r.status="conferida"; }
  else if(ac==="desconfirmar"){ r.fichaOk=false; }
  else if(ac==="duplicar"){ const id=uid(); const c=JSON.parse(JSON.stringify(r)); c.status="rascunho"; c.fichaOk=false; c.selo=""; c.cnib={resultado:"",hash:""}; c.criadoEm=new Date().toISOString(); arquivo[id]=c; atual=id; salvarDepois(id); toast("Cópia criada como rascunho"); renderMesa(); return; }
  else if(ac==="excluir"){ if(!b.classList.contains("armado")){ b.classList.add("armado"); b.textContent="Confirmar exclusão"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armado"); b.textContent="Excluir"; } },4000); return; } excluir(atual); return; }
  else if(ac==="docx"){ baixarDocx(r); return; }
  else if(ac==="copiar"){ const t=N.textoPlano(N.montar(r)); (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Texto copiado"),()=>toast("Não foi possível copiar; selecione o texto da minuta")); return; }
  salvarDepois(atual); redesenha();
});
function redesenha(){
  const y=window.scrollY, foco=document.activeElement && document.activeElement.id;
  renderMesa(); window.scrollTo(0,y);
  if(foco){ const el=document.getElementById(foco); if(el) el.focus({preventScroll:true}); }
}

async function baixarDocx(r){
  if(typeof JSZip==="undefined"){ toast("Gerador de Word não carregou. Recarregue a página."); return; }
  const m=N.montar(r); const z=new JSZip();
  Object.entries(N.DOCX_FIXOS).forEach(([k,v])=>z.file(k,v));
  z.file("word/document.xml", N.documentXml(m));
  const blob=await z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const nome=("Procuracao "+r.tipo+" - "+tituloReg(r)).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w\- ]+/g,"").replace(/\s+/g," ").trim().slice(0,90)+".docx";
  if(downloads){
    try{ await downloads.save({filename:nome, data:blob}); toast("Minuta salva: "+nome); }
    catch(e){ toast(e && e.code==="declined" ? "Download cancelado" : "Não foi possível baixar: "+(e&&e.message||"erro")); }
    return;
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); a.remove();
}

iniciar();
})();
</script>
