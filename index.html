const C={msgs:[],busy:false,topic:"Conversa livre",mic:false,fb:null,err:"",auto:true};
const GOAL=8;
const TOP={"Conversa livre":"whatever the learner wants (suggest a fun topic if needed)","Viagem":"travel plans and experiences","Entrevista":"a job interview; you play the interviewer","Dia a dia":"daily life, hobbies, food and friends","Debate":"a friendly debate on a light topic; politely take the opposite side"};

function chatHTML(){return `<div class="chips">${Object.keys(TOP).map(t=>`<button class="${t===C.topic?"on":""}" onclick="C.topic=this.textContent;resetChat();draw()">${t}</button>`).join("")}</div>

async function suggest(){if(C.busy||!C.msgs.length)return;C.busy=true;C.sug=null;C.err="";renderMsgs();try{const sample=window.claude&&await window.claude.use("sample");if(!sample)throw{code:"none"};const tr=C.msgs.map(m=>(m.r==="m"?"Learner: ":"Partner: ")+m.t).join("\n");C.sug=await sample.json(`A Brazilian English learner (B1-B2) is stuck in this conversation. Suggest 3 different natural replies they could say next to the Partner's last message: one short and simple, one with more detail, one that asks a question back. Return ONLY JSON: {"options":[{"en":"","pt":"Portuguese translation"}]}\n\n`+tr,{cache:false})}catch(e){C.err=errMsg(e)}C.busy=false;renderMsgs()}
function useSug(i){const o=C.sug.options[i];$("inp").value=o.en;S.draft=o.en;C.sug=null;renderMsgs();$("inp").focus()}

function errMsg(e){const c=e&&e.code;return c==="not_granted"?"Permita o acesso ao Claude para conversar.":c==="rate_limited"?"Muitas mensagens seguidas. Espere um pouco.":c==="none"?"A conversa com IA só funciona abrindo o app pelo link publicado no claude.ai.":"Algo deu errado. Tente de novo."}
async function ai(extra){const sample=window.claude&&await window.claude.use("sample");if(!sample)throw{code:"none"};const tr=C.msgs.map(m=>(m.r==="m"?"Learner: ":"Partner: ")+m.t).join("\n");return sample.json(SYS()+"\n\nConversation so far:\n"+(tr||"(not started)")+"\n\n"+extra,{cache:false})}

function send(t){const inp=$("inp");t=(t||(inp&&inp.value)||"").trim();if(!t||C.busy)return;if(inp)inp.value="";S.draft="";C.msgs.push({r:"m",t});C.sug=null;save();turn("Write the partner's next message and correct the learner's last message.")}

function practice(en,pt,tip,next,label){const q=JSON.stringify(en).replace(/"/g,"&quot;");const lb=label.replace(/\s*➜/,"");let bk="";const bb=(d,a)=>`<div class="orb"><button class="o" ${d?"disabled":""} onclick="${a}">⬅</button><span>Voltar</span></div>`;
if(S.tab===0)bk=bb(S.i%P[S.cat].length===0,"S.i--;S.res=null;draw()");else if(S.tab===1)bk=bb(S.t===0,"S.t--;S.hist.splice(-2);S.res=null;draw()");else if(S.tab===4&&LS.id!==null)bk=bb(false,"S.res=null;if(LS.sp>0)LS.sp--;else qbackS();draw()");

let VOICE=null;try{VOICE=localStorage.getItem("suv")}catch(e){}
function rank(v){const n=v.name.toLowerCase();if(!/^en[-_](us|gb|au|ca)/i.test(v.lang))return -1;let s=0;
if(/natural|neural|premium|enhanced/.test(n))s+=100;if(/online/.test(n))s+=40;if(/google/.test(n))s+=50;
if(/aria|jenny|guy|ava|andrew|emma|brian|michelle|christopher|eric|steffan|samantha|allison|evan|zoe|siri|nicky|karen|moira|serena|daniel/.test(n))s+=30;
if(/^en[-_]us/i.test(v.lang))s+=10;if(!v.localService)s+=5;
if(/compact|espeak|fred|ralph|albert|junior|bad news|bells|boing|bubbles|cellos|deranged|good news|hysterical|organ|trinoids|whisper|zarvox|superstar|jester/.test(n))s-=200;return s}
function voices(){return speechSynthesis.getVoices().filter(v=>rank(v)>-100).sort((a,b)=>rank(b)-rank(a))}
function best(){const l=voices();return l.find(v=>v.name===VOICE)||l[0]}
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();const v=best();const parts=t.match(/[^.!?]+[.!?]*/g)||[t];
parts.forEach(p=>{const u=new SpeechSynthesisUtterance(p.trim());u.lang=v?v.lang:"en-US";if(v)u.voice=v;u.rate=S.slow?.65:.92;u.pitch=1;speechSynthesis.speak(u)})}
function popV(){const b=$("vbox");if(!b||!window.speechSynthesis)return;const l=voices();if(!l.length){b.innerHTML="";return}const cur=best();
b.innerHTML=`<div class="vb"><label>🔊 Voz do inglês</label><select onchange="VOICE=this.value;try{localStorage.setItem('suv',VOICE)}catch(e){};speak('Hi! This is how I sound. Nice to meet you.')">${l.map(v=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?"selected":""}>${esc(v.name)} (${v.lang})</option>`).join("")}</select><small>Para soar mais humana, escolha uma voz com “Natural”, “Neural”, “Google”, “Premium” ou “Siri” no nome. Ao trocar, a voz toca como teste.</small></div>`}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=popV;

{t:`Verbo to be: I am, you are`,s:`Quem você é`,e:`O verbo <b>to be</b> significa <b>ser/estar</b>. Formas: <b>I am</b>, <b>you are</b>, <b>he/she/it is</b>, <b>we/you/they are</b>. Na fala: I'm, you're, he's, we're.`,x:[[`I am a student.`,`Eu sou estudante.`],[`You are my friend.`,`Você é meu amigo.`],[`She is at home.`,`Ela está em casa.`],[`We are from Brazil.`,`Nós somos do Brasil.`]],q:[[`She ___ a doctor.`,[`am`,`is`,`are`],1,`He/she/it usam IS.`],[`They ___ happy.`,[`is`,`am`,`are`],2,`They/we/you usam ARE.`],[`I ___ tired.`,[`am`,`is`,`are`],0,`Com I usamos sempre AM.`]]},
{t:`To be: negativo e perguntas`,s:`Dizer não e perguntar`,e:`Negativo: coloque <b>not</b> depois: <b>I am not</b>, <b>he isn't</b>, <b>they aren't</b>. Pergunta: inverta a ordem: <b>Are you</b> ready? <b>Is she</b> here?`,x:[[`I'm not tired.`,`Eu não estou cansado.`],[`He isn't at work.`,`Ele não está no trabalho.`],[`Are you ready?`,`Você está pronto?`],[`Where is the station?`,`Onde fica a estação?`]],q:[[`___ you from Brazil?`,[`Is`,`Are`,`Am`],1,`You combina com ARE.`],[`They ___ at home. (negativo)`,[`isn't`,`aren't`,`amn't`],1,`They + aren't.`],[`___ she your sister?`,[`Is`,`Are`,`Be`],0,`She combina com IS.`]]},
{t:`Present Simple: rotina`,s:`Hábitos do dia a dia`,e:`Use para hábitos e rotinas: <b>I work</b>, <b>you play</b>. Com he/she/it, acrescente <b>-s</b>: <b>she works</b>. Palavras úteis: always, usually, every day.`,x:[[`I work every day.`,`Eu trabalho todo dia.`],[`She drinks coffee in the morning.`,`Ela toma café de manhã.`],[`We usually eat at seven.`,`Normalmente jantamos às sete.`],[`He plays soccer on Sundays.`,`Ele joga futebol aos domingos.`]],q:[[`He ___ English every day.`,[`study`,`studies`,`studying`],1,`He + verbo com S (study → studies).`],[`They ___ at 8 o'clock.`,[`starts`,`start`,`starting`],1,`They usa o verbo sem S.`],[`She ___ to work by bus.`,[`go`,`goes`,`going`],1,`go → goes com she.`]]},
{t:`Do / Does: negar e perguntar`,s:`Present Simple completo`,e:`Negativo: <b>don't</b> (I/you/we/they) e <b>doesn't</b> (he/she/it) + verbo base. Pergunta: <b>Do you</b> like it? <b>Does she</b> work here? Depois de do/does, o verbo fica sem -s.`,x:[[`I don't like coffee.`,`Eu não gosto de café.`],[`She doesn't work on Sundays.`,`Ela não trabalha aos domingos.`],[`Do you speak English?`,`Você fala inglês?`],[`Does he live here?`,`Ele mora aqui?`]],q:[[`She ___ like pizza.`,[`don't`,`doesn't`,`isn't`],1,`She pede doesn't.`],[`___ they work here?`,[`Does`,`Do`,`Are`],1,`They pede DO.`],[`Does he ___ English?`,[`speaks`,`speak`,`speaking`],1,`Depois de does, verbo base.`]]},
{t:`Can / Can't: habilidades`,s:`O que você consegue fazer`,e:`<b>Can</b> = conseguir/poder. Não muda com he/she e vem com verbo base: <b>I can swim</b>, <b>she can't drive</b>. Pergunta: <b>Can you</b> help me?`,x:[[`I can speak a little English.`,`Eu falo um pouco de inglês.`],[`She can't swim.`,`Ela não sabe nadar.`],[`Can you help me, please?`,`Você pode me ajudar?`],[`We can meet at six.`,`A gente pode se encontrar às seis.`]],q:[[`She ___ drive a car.`,[`cans`,`can`,`is can`],1,`Can nunca leva S.`],[`Can you ___ me?`,[`helping`,`help`,`helps`],1,`Can + verbo base.`],[`I ___ swim. (não sei nadar)`,[`can't`,`don't can`,`not can`],0,`O negativo é can't.`]]},
{t:`Past Simple: was/were e -ed`,s:`Falar do passado`,e:`Passado do to be: <b>was</b> (I/he/she/it) e <b>were</b> (you/we/they). Verbos regulares ganham <b>-ed</b>: worked, played. Negativo e pergunta usam <b>did</b> + verbo base.`,x:[[`I was tired yesterday.`,`Eu estava cansado ontem.`],[`They were at the party.`,`Eles estavam na festa.`],[`She worked late last night.`,`Ela trabalhou até tarde ontem.`],[`Did you watch the game?`,`Você assistiu ao jogo?`]],q:[[`We ___ at home last night.`,[`was`,`were`,`are`],1,`We usa WERE.`],[`She ___ the piano yesterday.`,[`play`,`plays`,`played`],2,`Passado regular: play → played.`],[`Did you ___ the movie?`,[`liked`,`like`,`likes`],1,`Depois de did, verbo base.`]]},
{t:`Verbos irregulares no passado`,s:`go → went, buy → bought`,e:`Alguns verbos mudam por inteiro e não levam -ed: <b>go → went</b>, <b>have → had</b>, <b>see → saw</b>, <b>buy → bought</b>, <b>eat → ate</b>. Vale decorar os mais comuns.`,x:[[`I went to the beach last weekend.`,`Fui à praia no fim de semana passado.`],[`She bought a new phone.`,`Ela comprou um celular novo.`],[`We saw a great movie.`,`Vimos um filme ótimo.`],[`He ate pizza for dinner.`,`Ele comeu pizza no jantar.`]],q:[[`Yesterday I ___ to school.`,[`goed`,`went`,`gone`],1,`go → went.`],[`She ___ a car last year.`,[`buyed`,`bought`,`buy`],1,`buy → bought.`],[`We ___ that movie.`,[`seed`,`saw`,`see`],1,`see → saw.`]]},
{t:`Present Perfect`,s:`Experiências e resultados`,e:`Use <b>have/has + particípio</b> para experiências e resultados: <b>I have visited</b> Paris. <b>She has finished</b>. Palavras comuns: ever, never, already, yet, for, since.`,x:[[`I have never been to London.`,`Nunca fui a Londres.`],[`She has already finished.`,`Ela já terminou.`],[`Have you ever tried sushi?`,`Você já provou sushi?`],[`We have lived here for ten years.`,`Moramos aqui há dez anos.`]],q:[[`She ___ lived here since 2020.`,[`have`,`has`,`is`],1,`She pede HAS.`],[`Have you ever ___ sushi?`,[`eat`,`ate`,`eaten`],2,`Particípio de eat: eaten.`],[`I ___ never seen that.`,[`has`,`have`,`am`],1,`I pede HAVE.`]]},
{t:`Futuro: will e going to`,s:`Planos e previsões`,e:`<b>Will</b>: decisões na hora e previsões (<i>I'll help you</i>). <b>Going to</b>: planos já decididos ou evidências (<i>I'm going to travel</i>). Ambos vão com verbo base.`,x:[[`I'll call you later.`,`Eu te ligo mais tarde.`],[`I'm going to study tonight.`,`Vou estudar hoje à noite.`],[`It will rain tomorrow.`,`Vai chover amanhã.`],[`We're going to move next month.`,`Vamos nos mudar mês que vem.`]],q:[[`Look at those clouds! It's ___ rain.`,[`going to`,`will to`,`goes to`],0,`Evidência agora → going to.`],[`The phone is ringing. I ___ answer it.`,[`'ll`,`'m going`,`am`],0,`Decisão na hora → will.`],[`She ___ travel next week. (já planejou)`,[`is going to`,`will to`,`goes`],0,`Plano → going to.`]]},
{t:`Condicionais: 1st e 2nd`,s:`Se isso, então aquilo`,e:`<b>1st</b> (possível): If + presente, <b>will</b>: <i>If it rains, I will stay home.</i> <b>2nd</b> (hipótese): If + passado, <b>would</b>: <i>If I had time, I would travel.</i>`,x:[[`If it rains, I'll stay home.`,`Se chover, fico em casa.`],[`If I had more time, I would learn French.`,`Se eu tivesse mais tempo, aprenderia francês.`],[`If you study, you will pass.`,`Se você estudar, vai passar.`],[`What would you do if you won the lottery?`,`O que você faria se ganhasse na loteria?`]],q:[[`If I ___ rich, I would travel the world.`,[`am`,`were`,`will be`],1,`2nd conditional: passado (were).`],[`If she calls, I ___ answer.`,[`would`,`will`,`am`],1,`1st conditional: will.`],[`If we ___ early, we'll get good seats.`,[`arrive`,`arrived`,`will arrive`],0,`If + presente simples.`]]},
{t:`Modais: should, must, might`,s:`Conselho, obrigação, possibilidade`,e:`<b>Should</b> = conselho. <b>Must</b> = obrigação forte. <b>Might</b> = talvez. Todos + verbo base: <i>You should rest.</i> <i>You must wear a seatbelt.</i> <i>It might rain.</i>`,x:[[`You should drink more water.`,`Você deveria beber mais água.`],[`I must finish this today.`,`Preciso terminar isso hoje.`],[`It might rain this afternoon.`,`Pode ser que chova à tarde.`],[`You shouldn't worry so much.`,`Você não deveria se preocupar tanto.`]],q:[[`You look tired. You ___ rest.`,[`might`,`should`,`must to`],1,`Conselho → should.`],[`Passengers ___ wear seatbelts. (regra)`,[`might`,`should`,`must`],2,`Obrigação → must.`],[`She ___ come, I'm not sure.`,[`must`,`might`,`should`],1,`Possibilidade → might.`]]},
{t:`Voz passiva`,s:`Foco no resultado`,e:`Foco no resultado, não em quem faz: <b>to be + particípio</b>. <i>English is spoken worldwide.</i> (presente) <i>The house was built in 1990.</i> (passado) Use <b>by</b> para dizer quem fez.`,x:[[`English is spoken worldwide.`,`O inglês é falado no mundo todo.`],[`The house was built in 1990.`,`A casa foi construída em 1990.`],[`The email was sent yesterday.`,`O e-mail foi enviado ontem.`],[`This book was written by a Brazilian author.`,`Este livro foi escrito por um autor brasileiro.`]],q:[[`The cake ___ by my mom yesterday.`,[`made`,`was made`,`is making`],1,`Passado passivo: was + particípio.`],[`Spanish ___ in many countries.`,[`speaks`,`is spoken`,`spoke`],1,`Presente passivo: is + particípio.`],[`The windows ___ every week.`,[`are cleaned`,`clean`,`cleaning`],0,`are + particípio.`]]}];

{t:`Artigos: a, an, the`,s:`Qual usar?`,e:`<b>A</b> antes de som de consoante (a book), <b>an</b> antes de som de vogal (an apple, an hour). <b>The</b> para algo específico ou já conhecido: <i>the book on the table</i>. Sem artigo para coisas em geral no plural: <i>I like dogs.</i>`,x:[[`I have a dog and an umbrella.`,`Tenho um cachorro e um guarda-chuva.`],[`She is an engineer.`,`Ela é engenheira.`],[`Please close the door.`,`Feche a porta, por favor.`],[`I like music.`,`Eu gosto de música.`]],q:[[`I eat ___ apple every day.`,[`a`,`an`,`the`],1,`Apple começa com som de vogal → an.`],[`He waits for ___ hour.`,[`a`,`an`,`the`],1,`Hour tem H mudo → an.`],[`___ sun is very hot today.`,[`A`,`An`,`The`],2,`Só existe um sol → the.`]]},
{t:`Perguntas com Wh-`,s:`What, where, who, when, why, how`,e:`<b>What</b> (o quê), <b>where</b> (onde), <b>who</b> (quem), <b>when</b> (quando), <b>why</b> (por quê), <b>how</b> (como). Estrutura: <b>Wh- + do/does/is/are + sujeito</b>: <i>Where do you live?</i> <i>Why is she late?</i>`,x:[[`What do you do?`,`O que você faz?`],[`Where are you from?`,`De onde você é?`],[`When does the class start?`,`Quando a aula começa?`],[`How do you say this in English?`,`Como se diz isso em inglês?`]],q:[[`___ do you live? — In Rio.`,[`Who`,`Where`,`Why`],1,`Resposta é um lugar → where.`],[`___ is she crying? — Because she is sad.`,[`Why`,`When`,`How`],0,`Because responde why.`],[`Where ___ he work?`,[`do`,`does`,`is`],1,`He pede does.`]]},
{t:`Preposições: in, on, at`,s:`Tempo e lugar`,e:`<b>At</b>: hora e ponto exato (at 7, at the door). <b>On</b>: dias e superfícies (on Monday, on the table). <b>In</b>: meses, anos, cidades e espaços fechados (in May, in 2024, in Brazil).`,x:[[`The meeting is at 3 p.m.`,`A reunião é às 15h.`],[`I have class on Monday.`,`Tenho aula na segunda.`],[`She was born in July.`,`Ela nasceu em julho.`],[`The keys are on the table.`,`As chaves estão na mesa.`]],q:[[`See you ___ Friday!`,[`in`,`on`,`at`],1,`Dias da semana → on.`],[`I wake up ___ 6 o'clock.`,[`at`,`on`,`in`],0,`Hora exata → at.`],[`He lives ___ São Paulo.`,[`on`,`at`,`in`],2,`Cidades → in.`]]},
{t:`Phrasal verbs I`,s:`Verbo + partícula`,e:`Phrasal verbs têm sentido novo: <b>wake up</b> (acordar), <b>look for</b> (procurar), <b>turn on/off</b> (ligar/desligar), <b>give up</b> (desistir), <b>find out</b> (descobrir).`,x:[[`I wake up at six every day.`,`Acordo às seis todo dia.`],[`I'm looking for my keys.`,`Estou procurando minhas chaves.`],[`Please turn off the lights.`,`Apague as luzes, por favor.`],[`Don't give up!`,`Não desista!`]],q:[[`Can you ___ the TV? It's too loud.`,[`turn off`,`turn in`,`turn for`],0,`Desligar → turn off.`],[`I'm ___ my wallet. Have you seen it?`,[`looking at`,`looking for`,`looking up`],1,`Procurar → look for.`],[`Never ___! You can do it.`,[`give up`,`give out`,`give on`],0,`Desistir → give up.`]]},

{t:`3rd conditional e wish`,s:`Arrependimentos`,e:`<b>3rd conditional</b>: If + <b>had + particípio</b>, <b>would have + particípio</b>: <i>If I had studied, I would have passed.</i> <b>Wish</b> para lamentar: <i>I wish I had more time.</i> / <i>I wish I had called her.</i>`,x:[[`If I had known, I would have helped.`,`Se eu soubesse, teria ajudado.`],[`I wish I had studied harder.`,`Queria ter estudado mais.`],[`She would have come if she had been invited.`,`Ela teria vindo se tivesse sido convidada.`],[`I wish I lived closer to the beach.`,`Queria morar mais perto da praia.`]],q:[[`If I ___ earlier, I wouldn't have missed the bus.`,[`left`,`had left`,`would leave`],1,`3rd: had + particípio.`],[`If they had called, we ___ helped.`,[`would have`,`will have`,`would`],0,`3rd: would have + particípio.`],[`I wish I ___ more free time now.`,[`have`,`had`,`would have`],1,`Wish + passado para o presente irreal.`]]},
{t:`Discurso indireto`,s:`Contar o que alguém disse`,e:`Ao relatar, o tempo verbal costuma recuar: <i>I am tired</i> → She said she <b>was</b> tired. <i>I will call</i> → He said he <b>would</b> call. <i>I have finished</i> → She said she <b>had</b> finished.`,x:[[`She said she was tired.`,`Ela disse que estava cansada.`],[`He told me he would call later.`,`Ele me disse que ligaria depois.`],[`They said they had already left.`,`Eles disseram que já tinham saído.`],[`She asked me where I lived.`,`Ela me perguntou onde eu morava.`]],q:[[`Ele diz: I'm busy. → He said he ___ busy.`,[`is`,`was`,`will be`],1,`Presente recua para passado.`],[`Ela diz: I will help. → She said she ___ help.`,[`will`,`would`,`had`],1,`Will recua para would.`],[`He told ___ he was late.`,[`to me`,`me`,`for me`],1,`Told + pessoa direto: told me.`]]},
{t:`Conectores e nuances`,s:`Soar mais sofisticado`,e:`<b>Although</b> (embora) + frase: <i>Although it was late, we kept working.</i> <b>Despite</b> + substantivo ou -ing: <i>Despite the rain, we went out.</i> <b>Whereas</b> contrasta: <i>He likes tea, whereas I prefer coffee.</i> <b>Nevertheless</b> = no entanto.`,x:[[`Although it was late, we kept working.`,`Embora fosse tarde, continuamos trabalhando.`],[`Despite the rain, we went out.`,`Apesar da chuva, saímos.`],[`He likes tea, whereas I prefer coffee.`,`Ele gosta de chá, enquanto eu prefiro café.`],[`It was hard; nevertheless, she succeeded.`,`Foi difícil; mesmo assim, ela conseguiu.`]],q:[[`___ the traffic, we arrived on time.`,[`Although`,`Despite`,`Whereas`],1,`Despite + substantivo.`],[`___ he was tired, he kept running.`,[`Despite`,`Although`,`Nevertheless`],1,`Although + frase completa.`],[`She loves cities, ___ her brother loves nature.`,[`whereas`,`despite`,`although of`],0,`Whereas contrasta duas ideias.`]]});

{t:`This, that, these, those`,s:`Apontar e mostrar`,e:`<b>This/these</b> = perto (este/estes). <b>That/those</b> = longe (aquele/aqueles). Singular: this, that. Plural: these, those. <i>This is my phone.</i> <i>Those are my keys.</i>`,x:[[`This is my phone.`,`Este é meu celular.`],[`That house is huge.`,`Aquela casa é enorme.`],[`These shoes are comfortable.`,`Estes sapatos são confortáveis.`],[`Those people are my neighbors.`,`Aquelas pessoas são meus vizinhos.`]],q:[[`___ book here is mine.`,[`That`,`This`,`Those`],1,`Perto e singular → this.`],[`___ cars over there are fast.`,[`Those`,`These`,`This`],0,`Longe e plural → those.`],[`Look at ___ flowers in my hand!`,[`this`,`that`,`these`],2,`Perto e plural → these.`]]},
{t:`There is / There are`,s:`Existe, existem`,e:`<b>There is</b> + singular, <b>there are</b> + plural. Negativo: <b>there isn't / there aren't</b>. Pergunta: <i>Is there a bank near here?</i> <i>Are there any shops?</i>`,x:[[`There is a park near my house.`,`Há um parque perto da minha casa.`],[`There are three bedrooms.`,`Há três quartos.`],[`There isn't any milk.`,`Não há leite.`],[`Is there a bank near here?`,`Há um banco por aqui?`]],q:[[`There ___ two cats in the garden.`,[`is`,`are`,`be`],1,`Plural → there are.`],[`___ there a restaurant here?`,[`Is`,`Are`,`Do`],0,`Singular → is there.`],[`There ___ any water. (negativo)`,[`isn't`,`aren't`,`don't`],0,`Water é incontável → isn't.`]]},
{t:`Present Continuous`,s:`O que está acontecendo agora`,e:`Use <b>am/is/are + verbo-ing</b> para ações em andamento ou planos próximos: <i>I'm studying now.</i> <i>She is cooking.</i> Negativo: <i>They aren't working.</i> Pergunta: <i>Are you listening?</i>`,x:[[`I'm studying English right now.`,`Estou estudando inglês agora.`],[`She is cooking dinner.`,`Ela está cozinhando o jantar.`],[`They aren't working today.`,`Eles não estão trabalhando hoje.`],[`Are you listening to me?`,`Você está me ouvindo?`]],q:[[`He ___ a book right now.`,[`reads`,`is reading`,`read`],1,`Agora → is + verbo-ing.`],[`We ___ TV at the moment.`,[`are watching`,`watching`,`is watch`],0,`We pede are + -ing.`],[`___ she sleeping?`,[`Is`,`Are`,`Does`],0,`She pede is.`]]},
{t:`Comparativos e superlativos`,s:`Mais, menos, o mais`,e:`Adjetivos curtos: <b>-er / the -est</b> (taller, the tallest). Longos: <b>more / the most</b> (more interesting). Irregulares: good → better → the best. Compare com <b>than</b>: <i>She is taller than me.</i>`,x:[[`She is taller than her brother.`,`Ela é mais alta que o irmão.`],[`This book is more interesting than that one.`,`Este livro é mais interessante que aquele.`],[`He is the best player in the team.`,`Ele é o melhor jogador do time.`],[`Today is the hottest day of the year.`,`Hoje é o dia mais quente do ano.`]],q:[[`My car is ___ than yours.`,[`fast`,`faster`,`more fast`],1,`Curto: fast → faster.`],[`This is the ___ movie ever!`,[`most good`,`better`,`best`],2,`good → the best.`],[`English is ___ difficult than Math.`,[`more`,`most`,`er`],0,`Adjetivo longo → more.`]]},
{t:`Some, any, much, many`,s:`Quantidades`,e:`<b>Some</b> em frases afirmativas; <b>any</b> em negativas e perguntas. <b>Many</b> com contáveis (many books), <b>much</b> com incontáveis (much water). <i>How many apples?</i> <i>How much milk?</i>`,x:[[`I have some questions.`,`Tenho algumas perguntas.`],[`We don't have any milk.`,`Não temos leite.`],[`How many people are coming?`,`Quantas pessoas vão vir?`],[`There isn't much time.`,`Não há muito tempo.`]],q:[[`I don't have ___ money.`,[`some`,`any`,`many`],1,`Negativa → any.`],[`How ___ sugar do you want?`,[`many`,`much`,`any`],1,`Sugar é incontável → much.`],[`She has ___ friends in Canada.`,[`much`,`many`,`any`],1,`Friends é contável → many.`]]},
{t:`Who, which, that`,s:`Explicar quem e o quê`,e:`<b>Who</b> para pessoas, <b>which</b> para coisas, <b>that</b> para ambos, <b>where</b> para lugares. <i>The man who called is my boss.</i> <i>The book that I read was great.</i>`,x:[[`The woman who lives next door is a doctor.`,`A mulher que mora ao lado é médica.`],[`This is the book that I told you about.`,`Este é o livro de que te falei.`],[`That's the restaurant where we met.`,`Esse é o restaurante onde nos conhecemos.`],[`I have a friend who speaks five languages.`,`Tenho um amigo que fala cinco idiomas.`]],q:[[`The girl ___ won the prize is my cousin.`,[`which`,`who`,`where`],1,`Pessoa → who.`],[`I lost the phone ___ you gave me.`,[`who`,`where`,`that`],2,`Coisa → that/which.`],[`That is the city ___ I was born.`,[`where`,`who`,`which`],0,`Lugar → where.`]]},

{t:`Advérbios de frequência`,s:`Always, usually, never`,e:`<b>always</b>, <b>usually</b>, <b>often</b>, <b>sometimes</b>, <b>rarely</b>, <b>never</b>. Ficam antes do verbo, mas depois do verbo to be: <i>I usually wake up at 6.</i> <i>She is always late.</i>`,x:[[`I usually wake up at six.`,`Normalmente acordo às seis.`],[`She is always late.`,`Ela está sempre atrasada.`],[`We rarely eat out.`,`Raramente comemos fora.`],[`He never drinks coffee.`,`Ele nunca toma café.`]],q:[[`I ___ go to the gym on Mondays. (sempre)`,[`always`,`never`,`rarely`],0,`Sempre → always.`],[`She ___ happy.`,[`always is`,`is always`,`always are`],1,`Depois do verbo to be.`],[`They ___ watch TV. (nunca)`,[`never`,`always`,`usually`],0,`Nunca → never.`]]},
{t:`Perguntas indiretas`,s:`Could you tell me...`,e:`Para soar educado, use perguntas indiretas: a ordem fica normal (sujeito + verbo), sem do/does. <i>Where is the station?</i> → <i>Could you tell me where the station is?</i>`,x:[[`Could you tell me where the station is?`,`Pode me dizer onde fica a estação?`],[`Do you know what time it starts?`,`Você sabe que horas começa?`],[`I wonder if she is at home.`,`Será que ela está em casa?`],[`Can you tell me how much this costs?`,`Pode me dizer quanto isto custa?`]],q:[[`Could you tell me where ___?`,[`is the bank`,`the bank is`,`does the bank`],1,`Ordem normal: the bank is.`],[`Do you know what time ___?`,[`it is`,`is it`,`does it`],0,`Sem inversão: it is.`],[`I wonder ___ he likes it.`,[`if`,`do`,`that do`],0,`If = se.`]]},
{t:`Phrasal verbs de viagem`,s:`check in, take off`,e:`<b>check in</b> (fazer check-in), <b>take off</b> (decolar), <b>pick up</b> (buscar), <b>drop off</b> (deixar), <b>set off</b> (partir), <b>get on/off</b> (subir/descer).`,x:[[`We checked in at noon.`,`Fizemos o check-in ao meio-dia.`],[`The plane takes off at six.`,`O avião decola às seis.`],[`Can you pick me up at the airport?`,`Pode me buscar no aeroporto?`],[`We set off early in the morning.`,`Partimos de manhã cedo.`]],q:[[`The flight ___ at 8 p.m.`,[`takes off`,`takes up`,`takes in`],0,`Decolar → take off.`],[`Please ___ me ___ at the hotel.`,[`drop / off`,`drop / on`,`put / in`],0,`Deixar alguém → drop off.`],[`We need to ___ at the hotel first.`,[`check in`,`check out`,`check on`],0,`Check-in = chegar e registrar.`]]},
{t:`Question tags`,s:`isn't it?`,e:`Question tags confirmam algo: frase afirmativa + tag negativa, e vice-versa. <i>It's cold, isn't it?</i> <i>You don't like fish, do you?</i> Use o mesmo auxiliar da frase.`,x:[[`It's a nice day, isn't it?`,`Está um dia bonito, não está?`],[`You don't like fish, do you?`,`Você não gosta de peixe, gosta?`],[`She can swim, can't she?`,`Ela sabe nadar, não sabe?`],[`They live here, don't they?`,`Eles moram aqui, não moram?`]],q:[[`You are tired, ___?`,[`aren't you`,`don't you`,`are you`],0,`Afirmativa → tag negativa.`],[`He doesn't smoke, ___?`,[`does he`,`doesn't he`,`is he`],0,`Negativa → tag afirmativa.`],[`We should go, ___?`,[`shouldn't we`,`don't we`,`should we`],0,`Mesmo auxiliar: should.`]]},
{t:`Wish e If only`,s:`Queria que fosse diferente`,e:`<b>I wish / If only</b> + passado para o presente irreal: <i>I wish I had more time.</i> <i>If only I lived closer.</i> Use <b>were</b> para todas as pessoas: <i>I wish I were taller.</i>`,x:[[`I wish I had more free time.`,`Queria ter mais tempo livre.`],[`If only I lived closer to work.`,`Se ao menos eu morasse mais perto do trabalho.`],[`I wish I were taller.`,`Queria ser mais alto.`],[`She wishes she could speak Japanese.`,`Ela queria saber falar japonês.`]],q:[[`I wish I ___ a car.`,[`have`,`had`,`will have`],1,`Wish + passado.`],[`If only it ___ sunny today.`,[`is`,`were`,`will be`],1,`If only + passado/were.`],[`I wish I ___ speak French.`,[`can`,`could`,`would`],1,`Can → could.`]]},
{t:`Cleft sentences`,s:`It was... that`,e:`Para dar ênfase: <b>It was ... that</b> e <b>What ... is</b>. <i>It was Ana who called.</i> <i>What I need is a break.</i>`,x:[[`It was Ana who called me.`,`Foi a Ana quem me ligou.`],[`What I need is a long vacation.`,`O que eu preciso é de férias longas.`],[`It was in Kyoto that we met.`,`Foi em Kyoto que nos conhecemos.`],[`What surprised me was her honesty.`,`O que me surpreendeu foi a honestidade dela.`]],q:[[`___ I need is some rest.`,[`What`,`That`,`Which`],0,`What I need is...`],[`It was yesterday ___ I saw him.`,[`that`,`what`,`who`],0,`It was... that.`],[`It was my sister ___ called.`,[`who`,`what`,`where`],0,`Pessoa → who.`]]},
{t:`Registro formal e informal`,s:`Soar adequado`,e:`O mesmo pedido muda conforme a situação: informal <i>Can you send it?</i> / formal <i>Would you be able to send it?</i>. Evite contrações e gírias em e-mails formais.`,x:[[`Would you be able to send it today?`,`Você poderia enviar isso hoje?`],[`I would like to request more information.`,`Gostaria de solicitar mais informações.`],[`Thank you for your prompt reply.`,`Obrigado pela resposta rápida.`],[`I look forward to hearing from you.`,`Aguardo o seu retorno.`]],q:[[`Which is more formal?`,[`Gimme the file.`,`Could you send me the file?`,`Send me the file now!`],1,`Could you... é o mais formal.`],[`In a formal email, avoid ___.`,[`slang`,`full sentences`,`thank you`],0,`Evite gírias.`],[`'I look forward to hearing from you' significa...`,[`Aguardo seu retorno`,`Estou ansioso para vê-lo`,`Vou ligar para você`],0,`Fecho formal comum.`]]});
